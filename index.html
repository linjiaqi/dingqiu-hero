<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>顶球小英雄</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #102018;
    font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #stage {
    position: relative;
    width: min(100vw, 56vh);
    height: 100vh;
    margin: 0 auto;
    overflow: hidden;
    touch-action: none;
    background: #8ec86a;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    display: none;
    position: absolute;
    top: calc(10px + env(safe-area-inset-top));
    left: 14px; right: 14px;
    pointer-events: none;
    z-index: 2;
  }
  #hud.show { display: block; }
  #barlab {
    display: flex; justify-content: space-between;
    font-size: 12px; font-weight: 700;
    color: rgba(255,255,255,.92);
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    margin-bottom: 4px;
    letter-spacing: .08em;
  }
  #skybar {
    position: relative;
    height: 10px;
    border-radius: 99px;
    background: linear-gradient(90deg, #ffd56a 0%, #d5e58a 28%, #7ec8b0 58%, #24506e 82%, #14243c 100%);
    box-shadow: 0 1px 4px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.35);
  }
  #knob {
    position: absolute; top: 50%; left: 0%;
    width: 16px; height: 16px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: #fffdf6;
    border: 2px solid #243044;
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  #urge {
    display: none;
    margin-top: 8px;
    text-align: center;
    font-size: 15px; font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  #urge.show { display: block; }
  .screen {
    display: none;
    position: absolute; inset: 0;
    z-index: 3;
    flex-direction: column;
    justify-content: space-between;
    padding: calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .screen.show { display: flex; }
  h1 {
    margin: 6px 0 0;
    text-align: center;
    font-size: 40px;
    line-height: 1.15;
    color: #fffdf8;
    letter-spacing: 2px;
    text-shadow: 0 3px 0 rgba(176, 98, 20, .45), 0 10px 18px rgba(0,0,0,.18);
  }
  .sheet {
    pointer-events: auto;
    background: rgba(255, 250, 236, .94);
    border-radius: 22px;
    padding: 16px 16px 14px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(40, 30, 10, .18);
  }
  .task {
    margin: 0 0 12px;
    font-size: 17px;
    line-height: 1.5;
    font-weight: 700;
    color: #3c4a22;
  }
  .big {
    margin: 0 0 6px;
    font-size: 32px;
    font-weight: 900;
    color: #2c2418;
  }
  .sub {
    margin: 0 0 14px;
    font-size: 17px;
    font-weight: 700;
    color: #3d4a28;
  }
  .hint {
    margin: 10px 0 0;
    font-size: 12px;
    line-height: 1.45;
    color: #6a6248;
  }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    background: #ffcc3d;
    color: #3b2a08;
    font-family: inherit;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 1px;
    padding: 14px 28px;
    border-radius: 999px;
    min-width: 70%;
    box-shadow: 0 6px 0 #e09a12;
  }
  button:active { transform: translateY(3px); box-shadow: 0 3px 0 #e09a12; }
  button:disabled { opacity: .6; }
  .topgap { height: 8px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="barlab"><span>操场</span><span>交接</span><span>树下</span></div>
    <div id="skybar"><i id="knob"></i></div>
    <div id="urge"></div>
  </div>
  <div id="title" class="screen show">
    <h1>顶球小英雄</h1>
    <div class="sheet">
      <p class="task">把球往上顶，别让它落到下巴下面，再顶给前面的他。</p>
      <button id="btnStart" disabled>加载中…</button>
      <p class="hint">按住屏幕左右拖</p>
    </div>
  </div>
  <div id="fail" class="screen">
    <div class="topgap"></div>
    <div class="sheet">
      <p class="big" id="failText">球掉了</p>
      <button id="btnRetry">再来一次</button>
    </div>
  </div>
  <div id="win" class="screen">
    <div class="topgap"></div>
    <div class="sheet">
      <p class="big">走到树下啦</p>
      <p class="sub">他可以比耶了。</p>
      <button id="btnAgain">再玩一次</button>
    </div>
  </div>
</div>
<script>

(function () {
  "use strict";

  var SEG = 20;
  var ARRANGE = 0.48;
  var ARC = 0.9;
  var RETREAT = 0.95;
  var SWEEP = 2.2;
  var BOB = [0, -6, -2];
  var BOB_STEP = 0.16;
  // Hair-top centers, measured from opaque pixels. Not the peace-sign hand.
  // boy_walk.png 690x1202: cap centroid near (322, 18). Old (312, 22) sat left of the cap.
  // boy_victory.png 803x1202: head-top centroid near (375, 18). Raised hand is around x 96-190.
  var WALK_CX = 322 / 690;
  var WALK_CY = 18 / 1202;
  var WALK_PX = 345 / 690;
  var WALK_PY = 820 / 1202;
  var VIC_CX = 375 / 803;
  var VIC_CY = 18 / 1202;
  var VIC_PX = 530 / 803;
  var VIC_PY = 820 / 1202;
  // Chin: bottom of the face (dark crease under the jaw), not the chest.
  // Head half-width: skull at the hair/forehead, not the shoulders.
  var WALK_CHIN = 206 / 1202;
  var VIC_CHIN = 222 / 1202;
  var WALK_HEAD_HALF = 95 / 690;
  var VIC_HEAD_HALF = 110 / 803;
  var BRANCHES = [
    [{ t: 3.5, dir: 1 }, { t: 11.4, dir: -1 }],
    [{ t: 2.6, dir: 1 }, { t: 8.4, dir: -1 }, { t: 14.2, dir: 1 }]
  ];

  var stage = document.getElementById("stage");
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var hud = document.getElementById("hud");
  var knob = document.getElementById("knob");
  var urge = document.getElementById("urge");
  var titleEl = document.getElementById("title");
  var failEl = document.getElementById("fail");
  var winEl = document.getElementById("win");
  var failText = document.getElementById("failText");
  var btnStart = document.getElementById("btnStart");

  var W = 1, H = 1, dpr = 1;
  var imgWalk = new Image();
  var imgBall = new Image();
  var imgWin = new Image();
  var loaded = 0;

  var keyLeft = false, keyRight = false;
  var mouseInside = false;
  var touchActive = false;
  var pointerX = 0;
  // Full side-to-side on arrow keys. Under 0.4s so a branch knock is catchable.
  var KEY_CROSS_SEC = 0.36;

  var stars = [];
  var clouds = [];
  var flowers = [];
  var birds = [];

  var st = {
    mode: "title",
    segment: 0,
    segT: 0,
    time: 0,
    lean: 0,
    leanTarget: 0,
    aimX: 0,
    aimReady: false,
    freezeAim: 0,
    bobI: 0,
    bobAcc: 0,
    ball: { x: 0, y: 0, vx: 0, vy: 0, rot: 0 },
    ballReady: false,
    finale: false,
    launch: false,
    needFirst: false,
    settle: 0,
    prevCrown: 0,
    failKind: "drop",
    fade: 0,
    fallT: 0,
    travel: 0,
    freezeLean: 0,
    freezeBob: 0,
    branch: null,
    branchN: 0,
    phase: "",
    phaseT: 0,
    hWalk0: null,
    hVic0: null,
    hPair: null,
    trees: []
  };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }
  function css(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
  function smoothstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function skyAmount(p) {
    return smoothstep(clamp((p - 0.04) / 0.92, 0, 1));
  }

  function skyColors(t) {
    var dayTop = [255, 214, 120], dayHor = [198, 224, 130];
    var midTop = [255, 168, 112], midHor = [96, 186, 164];
    var nightTop = [14, 34, 62], nightHor = [26, 104, 100];
    if (t < 0.5) {
      var u = smoothstep(t / 0.5);
      return { top: mix(dayTop, midTop, u), hor: mix(dayHor, midHor, u) };
    }
    var v = smoothstep((t - 0.5) / 0.5);
    return { top: mix(midTop, nightTop, v), hor: mix(midHor, nightHor, v) };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth || window.innerWidth;
    H = stage.clientHeight || window.innerHeight;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (W > 2) {
      if (!st.aimReady) {
        st.aimX = W * 0.5;
        st.aimReady = true;
      }
      var lim = xLimits("walk", H * 0.56);
      st.aimX = clamp(st.aimX, lim.minC, lim.maxC);
    }
  }

  function journey() {
    if (st.mode === "title") return 0;
    if (st.mode === "win") return 1;
    if (st.segment === 0 || st.mode === "handoff") return clamp(st.segT / SEG, 0, 1) * 0.5;
    return 0.5 + clamp(st.segT / SEG, 0, 1) * 0.5;
  }

  function pathMul() {
    if (st.mode === "title" || st.segment === 0 || st.mode === "handoff") return 1;
    var t = st.mode === "win" ? 1 : clamp(st.segT / SEG, 0, 1);
    return lerp(0.7, 11 / 20, smoothstep(t));
  }

  function goalU() {
    if (st.mode === "title") return 0.08;
    if (st.mode === "win") return 1;
    if (st.segment === 0 || st.mode === "handoff") return 0.2;
    return lerp(0.2, 1, smoothstep(clamp(st.segT / SEG, 0, 1)));
  }

  function ballGeom() {
    var S = H / 800;
    var boyH = H * 0.56;
    var boyW = boyH * (690 / 1202);
    var headW = (172 / 690) * boyW;
    var visualD = headW * 1.22;
    var bh = visualD / ((385 - 16) / 402);
    var bw = bh * (376 / 402);
    var r = (185 / 402) * bh;
    return { S: S, bh: bh, bw: bw, r: r };
  }

  function kindSpec(kind) {
    if (kind === "walk") {
      return { cx: WALK_CX, cy: WALK_CY, px: WALK_PX, py: WALK_PY, iw: 690 };
    }
    return { cx: VIC_CX, cy: VIC_CY, px: VIC_PX, py: VIC_PY, iw: 803 };
  }

  function actorPose(kind, feetX, feetY, boyH, lean) {
    var spec = kindSpec(kind);
    var boyW = boyH * (spec.iw / 1202);
    var angle = lean * 0.15;
    var lx = (spec.cx - spec.px) * boyW;
    var ly = (spec.cy - spec.py) * boyH;
    var co = Math.cos(angle), si = Math.sin(angle);
    return {
      kind: kind, feetX: feetX, feetY: feetY, boyW: boyW, boyH: boyH,
      angle: angle, lean: lean, pivotX: spec.px, pivotY: spec.py,
      crownX: feetX + lx * co - ly * si,
      crownY: feetY + lx * si + ly * co,
      S: H / 800
    };
  }

  function plain(pose) {
    return { kind: pose.kind, feetX: pose.feetX, feetY: pose.feetY, boyH: pose.boyH, lean: pose.lean || 0 };
  }

  function lerpPlain(a, b, t) {
    return actorPose(
      a.kind,
      lerp(a.feetX, b.feetX, t),
      lerp(a.feetY, b.feetY, t),
      lerp(a.boyH, b.boyH, t),
      lerp(a.lean || 0, b.lean || 0, t)
    );
  }

  function playPose(kind, aimX, bobPx) {
    var boyH = H * 0.56;
    var feetX = feetForCrown(kind, boyH, aimX);
    var feetY = H * 0.84 + (bobPx || 0) * (H / 800);
    return actorPose(kind, feetX, feetY, boyH, 0);
  }

  function farVic() {
    return actorPose("vic", W * 0.5, horizonY() + H * 0.045, H * 0.062, 0);
  }

  function stagedPair() {
    var s = H * 0.3;
    var wW = s * (690 / 1202);
    var wV = s * (803 / 1202);
    var gap = wW;
    var total = wW + gap + wV;
    var fit = Math.max(40, W - 8);
    if (total > fit) {
      var k = fit / total;
      s *= k; wW *= k; wV *= k; gap *= k; total *= k;
    }
    var left = (W - total) / 2;
    var fy = H * 0.84;
    return {
      walk: { kind: "walk", feetX: left + WALK_PX * wW, feetY: fy, boyH: s, lean: 0 },
      vic: { kind: "vic", feetX: left + wW + gap + VIC_PX * wV, feetY: fy, boyH: s, lean: 0 }
    };
  }

  function activePose() {
    var frozen = st.mode === "fall" || st.mode === "fail";
    var aim = frozen ? st.freezeAim : st.aimX;
    var bob = frozen ? st.freezeBob : (st.finale || st.mode === "win" ? 0 : BOB[st.bobI]);
    if (st.mode === "win" || st.finale) return playPose("vic", aim, 0);
    if (st.segment === 0 || st.mode === "title") return playPose("walk", aim, bob);
    return playPose("vic", aim, bob);
  }

  function controlPose() {
    if (st.needFirst && st.hPair) {
      var p = st.hPair.vic;
      var feetX = feetForCrown("vic", p.boyH, st.aimX);
      return actorPose("vic", feetX, p.feetY, p.boyH, 0);
    }
    if (st.settle > 0 && st.hPair) return settlePack().vic;
    return activePose();
  }

  function gravity() { return 1700 * (H / 800); }

  function headHalf(pose) {
    var frac = pose.kind === "walk" ? WALK_HEAD_HALF : VIC_HEAD_HALF;
    return Math.max(8, frac * pose.boyW);
  }

  function chinPoint(pose) {
    var fy = pose.kind === "walk" ? WALK_CHIN : VIC_CHIN;
    var fx = pose.kind === "walk" ? WALK_CX : VIC_CX;
    var lx = (fx - pose.pivotX) * pose.boyW;
    var ly = (fy - pose.pivotY) * pose.boyH;
    var co = Math.cos(pose.angle), si = Math.sin(pose.angle);
    return pose.feetY + lx * si + ly * co;
  }

  function zoneHit(pose) {
    var r = ballGeom().r;
    var hw = headHalf(pose);
    var thick = 0.35 * r;
    var left = pose.crownX - hw;
    var right = pose.crownX + hw;
    var top = pose.crownY - thick * 0.5;
    var bot = pose.crownY + thick * 0.5;
    var nx = clamp(st.ball.x, left, right);
    var ny = clamp(st.ball.y, top, bot);
    var dx = st.ball.x - nx;
    var dy = st.ball.y - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function applyHeader(pose, finalePop) {
    var g = gravity();
    var hw = headHalf(pose);
    var along = clamp((st.ball.x - pose.crownX) / hw, -1, 1);
    var flight = st.segment === 0 ? 1 : 0.7;
    var vxMax = 1.15 * hw / flight;
    st.ball.vx = along * vxMax;
    if (finalePop) st.ball.vy = -g * 0.9;
    else if (st.segment === 0) st.ball.vy = -g * 0.5;
    else st.ball.vy = -g * 0.35;
  }

  function tossAbove(pose) {
    var r = ballGeom().r;
    st.ball.x = pose.crownX;
    st.ball.y = pose.crownY - r * 1.7;
    st.ball.vx = 0;
    st.ball.vy = gravity() * 0.15;
    st.launch = false;
  }

  function beginFall() {
    st.mode = "fall";
    st.failKind = "drop";
    st.fallT = 0;
    st.freezeLean = 0;
    st.freezeAim = st.aimX;
    st.freezeBob = 0;
    st.finale = false;
    st.launch = false;
    st.needFirst = false;
    st.settle = 0;
  }

  function stepBall(dt, pose, opt) {
    opt = opt || {};
    var g = gravity();
    var r = ballGeom().r;
    st.ball.vy += g * dt;
    st.ball.x += st.ball.vx * dt;
    st.ball.y += st.ball.vy * dt;
    st.ball.rot += st.ball.vx * dt * 0.012;
    if (st.ball.vy > 0 && zoneHit(pose)) {
      var finalePop = !!opt.finale && !st.launch;
      applyHeader(pose, finalePop);
      if (finalePop) st.launch = true;
      if (opt.onHeader) opt.onHeader();
      return;
    }
    if (st.launch && st.ball.y < -r) {
      st.mode = "win";
      st.fade = 0;
      st.launch = false;
      return;
    }
    if (!st.launch && st.ball.y > chinPoint(pose)) {
      if (opt.title) { tossAbove(pose); return; }
      beginFall();
    }
  }

  function branchX(b) {
    var u = clamp(b.t / SWEEP, 0, 1);
    var start = b.dir > 0 ? -b.len * 0.32 : W + b.len * 0.32;
    var end = b.dir > 0 ? W + b.len * 0.32 : -b.len * 0.32;
    return lerp(start, end, u);
  }

  function updateBranch(dt) {
    if (st.mode !== "play" || st.finale || st.needFirst || st.settle > 0) return;
    var plan = BRANCHES[st.segment];
    if (!st.branch && st.branchN < plan.length && st.segT >= plan[st.branchN].t) {
      var spec = plan[st.branchN];
      st.branch = {
        dir: spec.dir,
        t: 0,
        hit: false,
        y: st.ball.y,
        len: Math.min(W * 0.68, H * 0.4)
      };
      st.branchN += 1;
    }
    if (!st.branch) return;
    st.branch.t += dt;
    if (st.branch.t >= SWEEP) { st.branch = null; return; }
    if (st.branch.hit) return;
    var x = branchX(st.branch);
    var half = st.branch.len * 0.5;
    var nearest = clamp(st.ball.x, x - half, x + half);
    var dx = st.ball.x - nearest;
    var dy = st.ball.y - st.branch.y;
    var reach = ballGeom().r * 0.9;
    if (dx * dx + dy * dy <= reach * reach) {
      st.branch.hit = true;
      var pose = controlPose();
      st.ball.vx += st.branch.dir * headHalf(pose) * 3.1;
    }
  }

  function initWorld() {
    var rnd = mulberry32(11);
    st.trees = [];
    for (var i = 0; i < 8; i++) {
      st.trees.push({
        z: i / 8,
        side: i % 2 === 0 ? -1 : 1,
        spread: 0.45 + rnd() * 1.05,
        sc: 0.85 + rnd() * 0.45,
        kind: i % 3
      });
    }
    stars = [];
    rnd = mulberry32(3);
    for (var s = 0; s < 36; s++) stars.push({ x: rnd(), y: rnd() * 0.42, r: 0.6 + rnd() * 1.5, tw: rnd() * 6 });
    clouds = [];
    rnd = mulberry32(5);
    for (var k = 0; k < 4; k++) clouds.push({ x: rnd(), y: 0.08 + rnd() * 0.18, sc: 0.7 + rnd() * 0.8, sp: 0.012 + rnd() * 0.02 });
    flowers = [];
    rnd = mulberry32(9);
    for (var f = 0; f < 22; f++) flowers.push({ x: rnd(), y: 0.46 + rnd() * 0.5, sc: 0.6 + rnd() * 0.8, hue: rnd() });
    birds = [];
    rnd = mulberry32(13);
    for (var b = 0; b < 3; b++) birds.push({ x: rnd(), y: 0.1 + rnd() * 0.12, sp: 0.02 + rnd() * 0.03, ph: rnd() * 6 });
  }

  // Crown X the sprite can reach while the whole boy stays on screen.
  function xLimits(kind, boyH) {
    var spec = kindSpec(kind);
    var boyW = boyH * (spec.iw / 1202);
    var lx = (spec.cx - spec.px) * boyW;
    var margin = Math.max(4, W * 0.012);
    var minF = margin + spec.px * boyW;
    var maxF = W - margin - (1 - spec.px) * boyW;
    if (minF > maxF) {
      var mid = (minF + maxF) * 0.5;
      return { minF: mid, maxF: mid, minC: mid + lx, maxC: mid + lx, lx: lx, margin: margin };
    }
    return { minF: minF, maxF: maxF, minC: minF + lx, maxC: maxF + lx, lx: lx, margin: margin };
  }

  function feetForCrown(kind, boyH, crownX) {
    var lim = xLimits(kind, boyH);
    return clamp(crownX - lim.lx, lim.minF, lim.maxF);
  }

  function controlBox() {
    var kind = "walk";
    var boyH = H * 0.56;
    if ((st.needFirst && st.hPair) || st.segment === 1 || st.finale || st.mode === "win") kind = "vic";
    if (st.needFirst && st.hPair) boyH = st.hPair.vic.boyH;
    var lim = xLimits(kind, boyH);
    return { kind: kind, boyH: boyH, lim: lim };
  }

  // Direct horizontal control. No tilt, no return-to-center.
  // Touch drag and mouse x set aim immediately (smoothing time constant 0).
  // Arrow keys slide across the full crown span in KEY_CROSS_SEC (0.36s).
  function applyInput(dt) {
    if (st.settle > 0) return;
    var lim = controlBox().lim;
    if (touchActive) {
      st.aimX = pointerX;
    } else if (keyLeft !== keyRight) {
      var span = Math.max(0, lim.maxC - lim.minC);
      var speed = span / KEY_CROSS_SEC;
      st.aimX += (keyLeft ? -speed : speed) * dt;
    } else if (mouseInside) {
      st.aimX = pointerX;
    }
    st.aimX = clamp(st.aimX, lim.minC, lim.maxC);
  }

  function beginRound(segment) {
    st.mode = "play";
    st.segment = segment;
    st.segT = 0;
    st.phase = "";
    st.phaseT = 0;
    st.branch = null;
    st.branchN = 0;
    st.failKind = "drop";
    st.fade = 0;
    st.fallT = 0;
    st.bobI = 0;
    st.bobAcc = 0;
    st.lean = 0;
    st.leanTarget = 0;
    st.freezeLean = 0;
    st.aimX = W * 0.5;
    st.freezeBob = 0;
    st.hPair = null;
    if (segment === 0) {
      st.travel = 0;
      initWorld();
    }
    st.finale = false;
    st.launch = false;
    st.needFirst = false;
    st.settle = 0;
    st.prevCrown = 0;
    tossAbove(activePose());
    st.ballReady = true;
    syncUI();
  }

  function onStartPressed() {
    if (loaded < 3) return;
    beginRound(0);
  }

  function startHandoff() {
    st.mode = "handoff";
    st.phase = "arrange";
    st.phaseT = 0;
    st.branch = null;
    st.finale = false;
    st.launch = false;
    st.needFirst = false;
    st.settle = 0;
    st.hWalk0 = plain(playPose("walk", st.aimX, BOB[st.bobI]));
    st.hVic0 = plain(farVic());
    st.hPair = stagedPair();
  }

  function handoffActors() {
    var pair = st.hPair;
    if (!pair) return { walk: activePose(), vic: farVic(), walkA: 1 };
    if (st.phase === "arrange") {
      var k = smoothstep(clamp(st.phaseT / ARRANGE, 0, 1));
      return { walk: lerpPlain(st.hWalk0, pair.walk, k), vic: lerpPlain(st.hVic0, pair.vic, k), walkA: 1 };
    }
    return {
      walk: actorPose("walk", pair.walk.feetX, pair.walk.feetY, pair.walk.boyH, 0),
      vic: actorPose("vic", pair.vic.feetX, pair.vic.feetY, pair.vic.boyH, 0),
      walkA: 1
    };
  }

  function settlePack() {
    var u = smoothstep(1 - clamp(st.settle / RETREAT, 0, 1));
    var pair = st.hPair;
    var walkEnd = { kind: "walk", feetX: W * 0.5, feetY: horizonY() + H * 0.05, boyH: H * 0.048, lean: 0 };
    var vicPlay = playPose("vic", W * 0.5, 0);
    var vicEnd = { kind: "vic", feetX: vicPlay.feetX, feetY: vicPlay.feetY, boyH: vicPlay.boyH, lean: 0 };
    var walk = lerpPlain(pair.walk, walkEnd, u);
    var vicScript = lerpPlain(pair.vic, vicEnd, u);
    return { walk: walk, vic: vicScript, scripted: vicScript, walkA: 1 - u };
  }

  function nudgeBallToScript() {
    var pack = settlePack();
    var c = pack.scripted.crownX;
    if (st.prevCrown) st.ball.x += c - st.prevCrown;
    st.prevCrown = c;
  }

  function arcPoint(t) {
    var actors = handoffActors();
    var r = ballGeom().r;
    var y0 = actors.walk.crownY - r * 1.15;
    var y1 = actors.vic.crownY - r * 1.35;
    return {
      x: lerp(actors.walk.crownX, actors.vic.crownX, t),
      y: lerp(y0, y1, t) - Math.sin(Math.PI * t) * H * 0.16
    };
  }

  function releaseAboveVic() {
    var pair = st.hPair.vic;
    var pose = actorPose("vic", pair.feetX, pair.feetY, pair.boyH, 0);
    var r = ballGeom().r;
    st.ball.x = pose.crownX;
    st.ball.y = pose.crownY - r * 1.35;
    st.ball.vx = 0;
    st.ball.vy = gravity() * 0.2;
    st.launch = false;
    st.mode = "play";
    st.segment = 1;
    st.segT = 0;
    st.needFirst = true;
    st.settle = 0;
    st.phase = "";
    st.lean = 0;
    st.leanTarget = 0;
    st.aimX = pose.crownX;
    st.bobI = 0;
    st.bobAcc = 0;
    st.branch = null;
    st.branchN = 0;
  }

  function roundRect(x, y, w, h, r) {
    var rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawCloud(x, y, sc, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.ellipse(x, y, 36 * sc, 16 * sc, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 22 * sc, y + 4 * sc, 22 * sc, 14 * sc, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 24 * sc, y + 6 * sc, 20 * sc, 12 * sc, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawTree(x, y, s, nightT) {
    var trunk = mix([166, 112, 64], [48, 40, 36], nightT);
    var cols = [
      mix([46, 150, 62], [14, 78, 70], nightT),
      mix([78, 178, 70], [22, 112, 92], nightT),
      mix([170, 206, 92], [36, 132, 108], nightT)
    ];
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = css(trunk);
    roundRect(-7, -48, 14, 52, 4);
    ctx.fill();
    var blobs = [[0, -86, 30, 0], [-24, -66, 22, 1], [24, -64, 20, 1], [0, -62, 16, 2], [6, -100, 14, 2]];
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      ctx.beginPath();
      ctx.fillStyle = css(cols[b[3]]);
      ctx.arc(b[0], b[1], b[2], 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawGoalTree(x, y, s, nightT) {
    var trunk = mix([150, 98, 54], [42, 36, 32], nightT);
    var cols = [
      mix([40, 140, 58], [12, 72, 66], nightT),
      mix([70, 168, 66], [20, 104, 88], nightT),
      mix([176, 208, 96], [40, 128, 102], nightT)
    ];
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = css(trunk);
    roundRect(-9, -168, 18, 176, 6);
    ctx.fill();
    var blobs = [
      [0, -230, 46, 0],
      [-40, -200, 34, 1],
      [42, -198, 32, 1],
      [-18, -250, 26, 2],
      [22, -246, 24, 2],
      [0, -188, 28, 1],
      [0, -156, 40, 1],
      [-46, -142, 30, 2],
      [48, -140, 28, 0]
    ];
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      ctx.beginPath();
      ctx.fillStyle = css(cols[b[3]]);
      ctx.arc(b[0], b[1], b[2], 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function horizonY() { return H * 0.40; }

  function pathHalves() {
    var m = pathMul();
    return {
      near: W * 0.50 * m,
      far: W * 0.075 * m
    };
  }

  function halfAtY(y, halves) {
    var hy = horizonY();
    var t = clamp((y - hy) / Math.max(1, H - hy), 0, 1);
    return lerp(halves.far, halves.near, Math.pow(t, 0.9));
  }

  function drawBackground(p) {
    var skyT = skyAmount(p);
    var col = skyColors(skyT);
    var g = ctx.createLinearGradient(0, 0, 0, horizonY() + 10);
    g.addColorStop(0, css(col.top));
    g.addColorStop(1, css(col.hor));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var sunA = 1 - smoothstep(clamp((skyT - 0.15) / (11 / 20), 0, 1));
    if (sunA > 0.02) {
      var sunY = lerp(H * 0.14, H * 0.36, skyT);
      ctx.save();
      ctx.globalAlpha = sunA;
      ctx.fillStyle = "#fff1b0";
      ctx.beginPath();
      ctx.arc(W * 0.74, sunY, 34 * (H / 800), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255, 210, 90, 0.35)";
      ctx.beginPath();
      ctx.arc(W * 0.74, sunY, 52 * (H / 800), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    var moonA = smoothstep(clamp((skyT - 0.45) / 0.4, 0, 1));
    if (moonA > 0.02) {
      ctx.save();
      ctx.globalAlpha = moonA;
      ctx.fillStyle = "#f4f1d4";
      ctx.beginPath();
      ctx.arc(W * 0.22, H * 0.13, 22 * (H / 800), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    if (skyT > 0.35) {
      ctx.save();
      ctx.globalAlpha = smoothstep((skyT - 0.35) / 0.4);
      ctx.fillStyle = "#fff8dc";
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var tw = 0.45 + (11 / 20) * Math.abs(Math.sin(st.time * 2 + s.tw));
        ctx.globalAlpha = tw * smoothstep((skyT - 0.35) / 0.4);
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    var cloudA = 1 - smoothstep(clamp(skyT / 0.75, 0, 1));
    if (cloudA > 0.03) {
      for (var c = 0; c < clouds.length; c++) {
        var cl = clouds[c];
        var cx = ((cl.x + st.time * cl.sp) % 1.3 - 0.15) * W;
        drawCloud(cx, cl.y * H, cl.sc * (H / 800), cloudA);
      }
    }

    if (skyT < 0.65) {
      ctx.save();
      ctx.globalAlpha = 1 - skyT / 0.65;
      ctx.strokeStyle = "rgba(90,70,40,0.35)";
      ctx.lineWidth = 1.5;
      for (var bi = 0; bi < birds.length; bi++) {
        var bd = birds[bi];
        var bx = ((bd.x + st.time * bd.sp) % 1.2 - 0.1) * W;
        var by = bd.y * H + Math.sin(st.time * 3 + bd.ph) * 6;
        ctx.beginPath();
        ctx.moveTo(bx - 8, by);
        ctx.quadraticCurveTo(bx - 3, by - 6, bx, by);
        ctx.quadraticCurveTo(bx + 3, by - 6, bx + 8, by);
        ctx.stroke();
      }
      ctx.restore();
    }

    var hill = mix([138, 196, 96], [18, 78, 70], skyT);
    ctx.fillStyle = css(hill);
    ctx.beginPath();
    ctx.moveTo(0, horizonY() + 8);
    ctx.quadraticCurveTo(W * 0.18, horizonY() - 36, W * 0.38, horizonY() + 4);
    ctx.quadraticCurveTo(W * (11 / 20), horizonY() - 28, W * 0.72, horizonY() + 6);
    ctx.quadraticCurveTo(W * 0.88, horizonY() - 18, W, horizonY() + 10);
    ctx.lineTo(W, horizonY() + 30);
    ctx.lineTo(0, horizonY() + 30);
    ctx.fill();

    var grass = mix([96, 184, 78], [18, 72, 64], skyT);
    var grass2 = mix([78, 164, 64], [14, 58, 54], skyT);
    ctx.fillStyle = css(grass);
    ctx.fillRect(0, horizonY(), W, H - horizonY());
    ctx.fillStyle = css(grass2);
    ctx.beginPath();
    ctx.moveTo(0, horizonY() + 18);
    ctx.quadraticCurveTo(W * 0.5, horizonY() + 4, W, horizonY() + 22);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.fill();

    var flowerA = 1 - smoothstep(clamp((skyT - 0.2) / 0.7, 0, 1));
    if (flowerA > 0.05) {
      ctx.save();
      ctx.globalAlpha = flowerA;
      var halves0 = pathHalves();
      for (var fi = 0; fi < flowers.length; fi++) {
        var fl = flowers[fi];
        var fy = horizonY() + fl.y * (H - horizonY());
        var fx = fl.x * W;
        if (Math.abs(fx - W / 2) < halfAtY(fy, halves0) + 8) continue;
        var fr = (2.2 + fl.sc) * (H / 800);
        ctx.fillStyle = fl.hue > 0.5 ? "#ffd1dc" : "#ffe27a";
        ctx.beginPath();
        ctx.arc(fx, fy, fr, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#6aaa40";
        ctx.fillRect(fx - 0.6, fy, 1.2, 5 * fl.sc);
      }
      ctx.restore();
    }

    if (skyT < 11 / 20) {
      ctx.save();
      ctx.globalAlpha = (1 - skyT / (11 / 20)) * 0.9;
      ctx.strokeStyle = "rgba(120,80,40,0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W * 0.08, horizonY() - 6);
      ctx.lineTo(W * 0.92, horizonY() + 8);
      ctx.stroke();
      var flagColors = ["#ff7a7a", "#ffd15c", "#7ec8ff", "#b8e986"];
      for (var q = 0; q < 8; q++) {
        var t = q / 7;
        var x1 = lerp(W * 0.08, W * 0.92, t);
        var y1 = lerp(horizonY() - 6, horizonY() + 8, t);
        ctx.fillStyle = flagColors[q % 4];
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 + 10, y1 + 4);
        ctx.lineTo(x1, y1 + 14);
        ctx.fill();
      }
      ctx.restore();
    }

    var halves = pathHalves();
    var pathCol = mix([236, 206, 140], [58, 74, 92], skyT);
    var edgeCol = mix([214, 170, 96], [36, 48, 64], skyT);
    var hy = horizonY();
    ctx.fillStyle = css(edgeCol);
    ctx.beginPath();
    ctx.moveTo(W / 2 - halves.far - 8, hy);
    ctx.lineTo(W / 2 + halves.far + 8, hy);
    ctx.lineTo(W / 2 + halves.near + 14, H);
    ctx.lineTo(W / 2 - halves.near - 14, H);
    ctx.fill();
    ctx.fillStyle = css(pathCol);
    ctx.beginPath();
    ctx.moveTo(W / 2 - halves.far, hy);
    ctx.lineTo(W / 2 + halves.far, hy);
    ctx.lineTo(W / 2 + halves.near, H);
    ctx.lineTo(W / 2 - halves.near, H);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(W / 2 - halves.far, hy);
    ctx.lineTo(W / 2 + halves.far, hy);
    ctx.lineTo(W / 2 + halves.near, H);
    ctx.lineTo(W / 2 - halves.near, H);
    ctx.clip();
    var dashCol = mix([255, 244, 210], [180, 196, 206], skyT);
    ctx.fillStyle = css(dashCol);
    var spacing = 0.07;
    var off = (st.travel % spacing + spacing) % spacing;
    for (var u = off; u < 1.02; u += spacing) {
      var y = hy + Math.pow(u, 1.28) * (H * 0.98 - hy);
      var dw = lerp(3, 12, u);
      var dh = lerp(6, 18, u) * (H / 800);
      ctx.globalAlpha = 0.35 + u * 0.5;
      ctx.fillRect(W / 2 - dw / 2, y, dw, dh);
    }
    ctx.restore();

    var sorted = st.trees.slice().sort(function (a, b) { return a.z - b.z; });
    for (var ti = 0; ti < sorted.length; ti++) {
      var tr = sorted[ti];
      var depth = tr.z;
      var yT = hy + Math.pow(depth, 1.2) * (H * 1.02 - hy);
      var sc = (0.22 + depth * 1.05) * tr.sc * (H / 700);
      var half = halfAtY(Math.min(yT, H), halves);
      var xT = W / 2 + tr.side * (half + (26 + 40 * tr.spread) * sc);
      if (yT > H + 40) continue;
      drawTree(xT, yT, sc, skyT);
    }

    var gu = Math.max(goalU(), 0.02);
    var gy = hy + Math.pow(gu, 1.02) * (H * 0.9 - hy);
    var gs = lerp(0.16, 2.75, gu) * (H / 800);
    drawGoalTree(W * 0.5 + (1 - gu) * W * 0.03, gy, gs, skyT);
  }



  function drawBoy(pose, alpha) {
    if (!imgWalk.complete || !imgWalk.naturalWidth || alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(pose.feetX, pose.feetY);
    ctx.rotate(pose.angle);
    ctx.drawImage(imgWalk, -pose.pivotX * pose.boyW, -pose.pivotY * pose.boyH, pose.boyW, pose.boyH);
    ctx.restore();
  }

  function drawVic(pose, alpha) {
    if (!imgWin.complete || !imgWin.naturalWidth || alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(pose.feetX, pose.feetY);
    ctx.rotate(pose.angle);
    ctx.drawImage(imgWin, -pose.pivotX * pose.boyW, -pose.pivotY * pose.boyH, pose.boyW, pose.boyH);
    ctx.restore();
  }

  function drawBallSprite(x, y, rot, bw, bh, alpha) {
    if (!imgBall.complete || !imgBall.naturalWidth) return;
    var fx = 187.5 / 376;
    var fy = 200 / 402;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.drawImage(imgBall, -fx * bw, -fy * bh, bw, bh);
    ctx.restore();
  }

  function drawShadow(pose, alpha) {
    if (!pose || alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = 0.22 * alpha;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(pose.feetX, pose.feetY + 8, pose.boyW * 0.28, 9 * pose.S, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBranch(b) {
    var x = branchX(b);
    var y = b.y;
    var len = b.len;
    var thick = Math.max(7, H * 0.011);
    ctx.save();
    ctx.fillStyle = "#7a4e2a";
    roundRect(x - len / 2, y - thick / 2, len, thick, thick);
    ctx.fill();
    ctx.fillStyle = "#5f9a38";
    var spots = [-0.34, -0.08, 0.18, 0.38];
    for (var i = 0; i < spots.length; i++) {
      var lx = x + spots[i] * len;
      ctx.beginPath();
      ctx.ellipse(lx, y - thick * 1.3, 14 * (H / 800), 9 * (H / 800), -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(lx + 7 * (H / 800), y + thick * 0.4, 11 * (H / 800), 7 * (H / 800), 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function advanceWorld(dt, rate) {
    st.bobAcc += dt;
    if (st.bobAcc >= BOB_STEP) {
      st.bobAcc -= BOB_STEP;
      st.bobI = (st.bobI + 1) % 3;
    }
    st.travel += dt * rate;
    for (var i = 0; i < st.trees.length; i++) {
      st.trees[i].z += dt * rate * 0.36;
      if (st.trees[i].z >= 1) st.trees[i].z -= 1;
    }
  }

  function stepPlay(dt) {
    if (st.mode !== "play") return;
    var cinematic = st.needFirst || st.settle > 0 || st.finale;
    if (!cinematic) advanceWorld(dt, 0.32);
    if (st.settle > 0) {
      nudgeBallToScript();
      st.settle -= dt;
      if (st.settle <= 0) {
        st.settle = 0;
        st.prevCrown = 0;
        st.aimX = W * 0.5;
      }
    }
    updateBranch(dt);
    var pose = controlPose();
    stepBall(dt, pose, {
      finale: st.finale,
      onHeader: function () {
        if (st.needFirst) {
          st.needFirst = false;
          st.settle = RETREAT;
          st.prevCrown = 0;
        }
      }
    });
    if (st.mode !== "play") return;
    if (st.needFirst || st.settle > 0 || st.finale) return;
    st.segT += dt;
    if (st.segment === 0 && st.segT >= SEG) {
      st.segT = SEG;
      startHandoff();
      return;
    }
    if (st.segment === 1 && st.segT >= SEG && goalU() >= 1) {
      st.segT = SEG;
      st.finale = true;
      st.branch = null;
    }
  }

  function stepTitle(dt) {
    advanceWorld(dt, 0.1);
    var lim = xLimits("walk", H * 0.56);
    st.aimX = clamp(st.ball.x, lim.minC, lim.maxC);
    stepBall(dt, playPose("walk", st.aimX, BOB[st.bobI]), { title: true });
  }

  function stepHandoff(dt) {
    if (st.mode !== "handoff") return;
    st.lean += (0 - st.lean) * (1 - Math.exp(-dt * 8));
    st.phaseT += dt;
    var actors = handoffActors();
    var r = ballGeom().r;
    if (st.phase === "arrange") {
      st.ball.x = actors.walk.crownX;
      st.ball.y = actors.walk.crownY - r * 1.5;
      st.ball.vx = 0;
      st.ball.vy = 0;
      if (st.phaseT >= ARRANGE) {
        st.phase = "arc";
        st.phaseT = 0;
      }
      return;
    }
    var u = clamp(st.phaseT / ARC, 0, 1);
    var p = arcPoint(u);
    st.ball.x = p.x;
    st.ball.y = p.y;
    st.ball.rot += dt * 2.2;
    if (st.phaseT >= ARC) releaseAboveVic();
  }

  function stepFall(dt) {
    var g = gravity();
    st.fallT += dt;
    st.ball.vy += g * dt;
    st.ball.vx *= Math.exp(-dt * 0.35);
    st.ball.x += st.ball.vx * dt;
    st.ball.y += st.ball.vy * dt;
    st.ball.rot += st.ball.vx * dt * 0.02;
    var ground = H * 0.9;
    if (st.ball.y > ground) {
      st.ball.y = ground;
      if (st.ball.vy > 0) st.ball.vy *= -0.38;
      st.ball.vx *= 0.82;
    }
    if (st.branch) {
      st.branch.t += dt;
      if (st.branch.t >= SWEEP) st.branch = null;
    }
    if (st.fallT > 0.95) st.mode = "fail";
  }

  function update(dt) {
    st.time += dt;
    if (!st.ballReady && loaded === 3 && W > 2) {
      tossAbove(playPose("walk", W * 0.5, 0));
      st.ballReady = true;
    }
    if (loaded < 3 || !st.ballReady) return;

    var n = Math.max(1, Math.ceil(dt / (1 / 90)));
    var h = dt / n;
    if (st.mode === "title") {
      for (var i = 0; i < n; i++) stepTitle(h);
    } else if (st.mode === "play") {
      for (var j = 0; j < n; j++) {
        if (st.mode !== "play") break;
        applyInput(h);
        stepPlay(h);
      }
    } else if (st.mode === "handoff") {
      for (var a = 0; a < n; a++) {
        if (st.mode !== "handoff") break;
        stepHandoff(h);
      }
    } else if (st.mode === "fall") {
      stepFall(dt);
    } else if (st.mode === "win") {
      st.fade = Math.min(1, st.fade + dt / 0.85);
    }
  }

  function visualPair() {
    if (st.mode === "handoff") return handoffActors();
    if (st.needFirst && st.hPair) {
      var w = st.hPair.walk;
      var v = st.hPair.vic;
      var feetX = feetForCrown("vic", v.boyH, st.aimX);
      return {
        walk: actorPose("walk", w.feetX, w.feetY, w.boyH, 0),
        vic: actorPose("vic", feetX, v.feetY, v.boyH, 0),
        walkA: 1
      };
    }
    if (st.settle > 0 && st.hPair) return settlePack();
    return null;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var p = (st.mode === "win" || st.finale) ? 1 : journey();
    drawBackground(p);
    var g = ballGeom();
    var pack = visualPair();
    if (pack) {
      drawShadow(pack.walk, pack.walkA);
      drawBoy(pack.walk, pack.walkA);
      drawShadow(pack.vic, 1);
      drawVic(pack.vic, 1);
    } else if (st.segment === 0 || st.mode === "title") {
      var far = farVic();
      drawShadow(far, 1);
      drawVic(far, 1);
      var wp = controlPose();
      drawShadow(wp, 1);
      drawBoy(wp, 1);
    } else {
      var vp = controlPose();
      drawShadow(vp, 1);
      drawVic(vp, 1);
    }
    if (st.branch) drawBranch(st.branch);
    if (loaded === 3 && st.mode !== "win") drawBallSprite(st.ball.x, st.ball.y, st.ball.rot, g.bw, g.bh, 1);
  }

  function syncUI() {
    titleEl.classList.toggle("show", st.mode === "title");
    failEl.classList.toggle("show", st.mode === "fail");
    var under = st.mode === "win" && st.fade > 0.45;
    winEl.classList.toggle("show", under);
    var playing = st.mode === "play" || st.mode === "fall" || st.mode === "fail" || st.mode === "win" || st.mode === "handoff";
    hud.classList.toggle("show", playing);
    knob.style.left = (journey() * 100) + "%";
    var hint = "";
    if (st.mode === "play" && st.segment === 0 && st.segT > SEG - 4) hint = "准备顶给他";
    else if (st.mode === "play" && st.finale) hint = "再顶一下，把球送上去";
    else if (st.mode === "play" && st.segment === 1 && st.segT > SEG - 4.5 && !st.needFirst) hint = "快到树下了，稳住";
    urge.textContent = hint;
    urge.classList.toggle("show", hint !== "");
    if (st.mode === "fail" || st.mode === "fall") failText.textContent = "球掉了";
  }

  var last = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    update(dt);
    draw();
    syncUI();
    requestAnimationFrame(frame);
  }

  function stageLocalX(clientX) {
    var r = stage.getBoundingClientRect();
    return clientX - r.left;
  }

  window.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "touch") return;
    if (e.target && e.target.closest && e.target.closest("button")) return;
    touchActive = true;
    pointerX = stageLocalX(e.clientX);
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  window.addEventListener("pointermove", function (e) {
    if (e.pointerType === "mouse") {
      mouseInside = true;
      pointerX = stageLocalX(e.clientX);
    } else if (touchActive) {
      pointerX = stageLocalX(e.clientX);
    }
  });
  window.addEventListener("pointerup", function (e) {
    if (e.pointerType === "touch") touchActive = false;
  });
  window.addEventListener("pointercancel", function () { touchActive = false; });
  window.addEventListener("blur", function () {
    touchActive = false;
    keyLeft = false;
    keyRight = false;
  });
  document.addEventListener("pointerout", function (e) {
    if (e.pointerType === "mouse" && !e.relatedTarget) mouseInside = false;
  });
  window.addEventListener("touchmove", function (e) {
    if (touchActive) e.preventDefault();
  }, { passive: false });

  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { keyLeft = true; e.preventDefault(); }
    else if (e.key === "ArrowRight") { keyRight = true; e.preventDefault(); }
    else if (e.key === "Enter") {
      var btn = document.querySelector(".screen.show button");
      if (btn && !btn.disabled) btn.click();
    }
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft") keyLeft = false;
    else if (e.key === "ArrowRight") keyRight = false;
  });
  window.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  btnStart.addEventListener("click", onStartPressed);
  document.getElementById("btnRetry").addEventListener("click", function () {
    beginRound(st.segment);
  });
  document.getElementById("btnAgain").addEventListener("click", function () {
    beginRound(0);
  });

  function markLoaded() {
    loaded++;
    if (loaded >= 3) {
      btnStart.disabled = false;
      btnStart.textContent = "开始";
      initWorld();
      resize();
      tossAbove(playPose("walk", W * 0.5, 0));
      st.ballReady = true;
    }
  }
  imgWalk.onload = markLoaded;
  imgBall.onload = markLoaded;
  imgWin.onload = markLoaded;
  imgWalk.src = "./boy_walk.png";
  imgBall.src = "./ball.png";
  imgWin.src = "./boy_victory.png";

  window.addEventListener("resize", resize);
  resize();
  initWorld();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
