<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>守住大树</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: #14331c;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  body { position: fixed; inset: 0; }
  #stage {
    height: 100dvh;
    width: min(100vw, calc(100dvh * 9 / 16));
    margin: 0 auto;
    position: relative;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    overflow: hidden;
    background: #73c85a;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 10px 6px;
    background: linear-gradient(#e7f8c8, #b6e585);
    color: #173416;
    font-weight: 800;
  }
  #title { font-size: 18px; letter-spacing: 1px; }
  #sun, #wave { font-size: 15px; white-space: nowrap; }
  #sun::before {
    content: "";
    display: inline-block;
    width: 0.85em;
    height: 0.85em;
    margin-right: 4px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff7c2, #f0b400);
    box-shadow: 0 0 0 2px #d4890c;
    vertical-align: -2px;
  }
  #board { position: relative; min-height: 0; }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #hint {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #1d3d16;
    background: #9ad86e;
    padding: 4px 8px 2px;
  }
  #bar {
    display: flex;
    gap: 10px;
    padding: 6px 10px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(#8dcf62, #5eaa44);
  }
  .card {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 72px;
    background: #fff8ea;
    border: 3px solid #8d6a3a;
    border-radius: 16px;
    padding: 6px 8px;
    color: #2b2418;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .card img {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 12%;
    background: #efe4cf;
    pointer-events: none;
    flex: 0 0 auto;
  }
  .meta { display: flex; flex-direction: column; gap: 2px; }
  .meta b { font-size: 18px; }
  .meta small { font-size: 13px; font-weight: 800; color: #c47d12; }
  .card.is-on {
    border-color: #f0c014;
    box-shadow: 0 0 0 3px #ffe27a;
  }
  .card.poor { filter: saturate(0.75); }
  #toast {
    position: absolute;
    left: 50%;
    bottom: 128px;
    transform: translateX(-50%);
    background: #7a2e16;
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    padding: 8px 16px;
    border-radius: 999px;
    z-index: 3;
    pointer-events: none;
  }
  #toast[hidden] { display: none; }
  #sheet {
    position: absolute;
    inset: 0;
    background: rgba(8, 28, 12, 0.4);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 14%;
    z-index: 4;
  }
  #sheet[hidden] { display: none; }
  .sheet-card {
    background: #fffaf0;
    border: 4px solid #e2b84a;
    border-radius: 18px;
    padding: 18px 26px 16px;
    text-align: center;
    min-width: 58%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }
  .sheet-card h2 {
    margin: 0;
    font-size: 32px;
    color: #24501c;
  }
  #retry {
    margin-top: 14px;
    font: inherit;
    font-size: 18px;
    font-weight: 800;
    padding: 10px 22px;
    border: none;
    border-radius: 999px;
    background: #efb423;
    color: #3a2a08;
    cursor: pointer;
  }
  @media (max-height: 560px) {
    header { padding: 4px 8px; }
    #title { font-size: 16px; }
    .card { min-height: 58px; }
    .card img { width: 42px; height: 42px; }
    .meta b { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div id="title">守住大树</div>
    <div id="sun">阳光 120</div>
    <div id="wave">第1/5波</div>
  </header>
  <div id="board"><canvas id="cv"></canvas></div>
  <div id="hint">点英雄，再点路边的空位</div>
  <div id="bar">
    <button type="button" class="card" id="card-walk">
      <img src="./boy_walk.png" alt="黑外套" draggable="false">
      <span class="meta"><b>黑外套</b><small>50 阳光</small></span>
    </button>
    <button type="button" class="card" id="card-ye">
      <img src="./boy_victory.png" alt="比耶" draggable="false">
      <span class="meta"><b>比耶</b><small>80 阳光</small></span>
    </button>
  </div>
  <div id="toast" hidden>阳光不足</div>
  <div id="sheet" hidden>
    <div class="sheet-card">
      <h2 id="sheet-title">守住了</h2>
      <button type="button" id="retry">再玩一次</button>
    </div>
  </div>
</div>
<script>
"use strict";
// PURE_START
const WAY_F = [
  { x: 0.26, y: -0.06 },
  { x: 0.26, y: 0.30 },
  { x: 0.74, y: 0.30 },
  { x: 0.74, y: 0.58 },
  { x: 0.38, y: 0.90 }
];
const SLOT_SPECS = [
  { seg: 0, t: 0.34, side: 1 },
  { seg: 0, t: 0.80, side: 1 },
  { seg: 1, t: 0.34, side: -1 },
  { seg: 1, t: 0.66, side: 1 },
  { seg: 2, t: 0.55, side: -1 },
  { seg: 3, t: 0.42, side: -1 }
];
const ROAD_F = 0.125;
const SLOT_R_F = 0.062;
const SLOT_OFF_F = 0.165;
const RANGE_WALK_F = 0.25;
const RANGE_YE_F = 0.33;
const WALK_SECONDS = 16;
const FAST_MULT = 1.6;
const START_SUN = 120;
const COST_WALK = 50;
const COST_YE = 80;
const KILL_SUN = 20;
const TREE_MAX = 5;
const PAUSE = 3;
const FIRE_WALK = 0.6;
const FIRE_YE = 1.6;
const SLOW_TIME = 1.2;
const SHOT_SPEED_F = 0.9;
const WAVES = [
  { gap: 1.15, list: ["n", "n", "n", "n", "n"] },
  { gap: 1.05, list: ["n", "n", "n", "n", "n", "n", "n"] },
  { gap: 0.98, list: ["n", "n", "n", "n", "n", "n", "n", "n"] },
  { gap: 0.86, list: ["n", "n", "f", "n", "n", "f", "n", "f", "n", "f"] },
  { gap: 0.74, list: ["n", "f", "n", "f", "n", "f", "n", "f", "n", "f", "f"] }
];

function distToSeg(a, b, x, y) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((x - a.x) * dx + (y - a.y) * dy) / len2 : 0;
  if (t < 0) t = 0;
  else if (t > 1) t = 1;
  const px = a.x + dx * t;
  const py = a.y + dy * t;
  return Math.hypot(x - px, y - py);
}

function distToPath(pts, x, y) {
  let best = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const d = distToSeg(pts[i], pts[i + 1], x, y);
    if (d < best) best = d;
  }
  return best;
}

function placeSlot(pts, spec, w, h, roadHalf, slotR) {
  const a = pts[spec.seg];
  const b = pts[spec.seg + 1];
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const side = spec.side;
  const nx = (-dy / len) * side;
  const ny = (dx / len) * side;
  const px = a.x + dx * spec.t;
  const py = a.y + dy * spec.t;
  let off = SLOT_OFF_F * w;
  const maxOff = (RANGE_WALK_F - 0.02) * w;
  let x = px + nx * off;
  let y = py + ny * off;
  const margin = slotR + 3;
  for (let k = 0; k < 10; k++) {
    const d = distToPath(pts, x, y);
    const inside = x >= margin && x <= w - margin && y >= margin && y <= h - margin;
    if (d >= roadHalf + slotR + 2 && inside) break;
    off = Math.min(maxOff, off + 0.01 * w);
    x = px + nx * off;
    y = py + ny * off;
  }
  if (x < margin) x = margin;
  else if (x > w - margin) x = w - margin;
  if (y < margin) y = margin;
  else if (y > h - margin) y = h - margin;
  return { x: x, y: y, seg: spec.seg, t: spec.t, off: off };
}

function buildLayout(w, h) {
  const pts = WAY_F.map((p) => ({ x: p.x * w, y: p.y * h }));
  const segLens = [];
  let pathLen = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const L = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
    segLens.push(L);
    pathLen += L;
  }
  const road = ROAD_F * w;
  const slotR = SLOT_R_F * w;
  const slots = SLOT_SPECS.map((spec) => placeSlot(pts, spec, w, h, road * 0.5, slotR));
  return {
    w: w,
    h: h,
    pts: pts,
    segLens: segLens,
    pathLen: pathLen,
    road: road,
    slotR: slotR,
    rangeWalk: RANGE_WALK_F * w,
    rangeYe: RANGE_YE_F * w,
    slots: slots,
    monH: 0.15 * w,
    treeW: 0.50 * w
  };
}

function pointAt(layout, u) {
  let dist = u * layout.pathLen;
  if (dist < 0) dist = 0;
  const pts = layout.pts;
  const segLens = layout.segLens;
  for (let i = 0; i < segLens.length; i++) {
    const L = segLens[i];
    if (dist <= L || i === segLens.length - 1) {
      const t = L ? dist / L : 0;
      const a = pts[i];
      const b = pts[i + 1];
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t,
        seg: i
      };
    }
    dist -= L;
  }
  const last = pts[pts.length - 1];
  return { x: last.x, y: last.y, seg: pts.length - 2 };
}
// PURE_END

const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");
const board = document.getElementById("board");
const sunEl = document.getElementById("sun");
const waveEl = document.getElementById("wave");
const cardWalk = document.getElementById("card-walk");
const cardYe = document.getElementById("card-ye");
const toastEl = document.getElementById("toast");
const sheet = document.getElementById("sheet");
const sheetTitle = document.getElementById("sheet-title");
const retryBtn = document.getElementById("retry");

const assets = {
  walk: loadImage("./boy_walk.png", false),
  victory: loadImage("./boy_victory.png", false),
  ball: loadImage("./ball.png", false),
  monster: loadImage("./monster.png", true),
  tree: loadImage("./tree.png", false)
};

let layout = null;
let sun = START_SUN;
let treeHp = TREE_MAX;
let waveIndex = 0;
let phase = "intro";
let introT = PAUSE;
let monsters = [];
let shots = [];
let pulses = [];
let floats = [];
let towers = [null, null, null, null, null, null];
let selected = null;
let queue = [];
let spawnCd = 0;
let result = null;
let nextId = 1;
let treeShake = 0;
let toastT = 0;
let time = 0;
let lastTs = 0;

function loadImage(src, tint) {
  const rec = { img: new Image(), ok: false, failed: false, tinted: null };
  rec.img.onload = function () {
    rec.ok = true;
    rec.failed = false;
    if (tint) rec.tinted = makeFastTint(rec.img);
  };
  rec.img.onerror = function () {
    rec.ok = false;
    rec.failed = true;
  };
  rec.img.src = src;
  return rec;
}

function makeFastTint(img) {
  const c = document.createElement("canvas");
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const g = c.getContext("2d");
  g.filter = "hue-rotate(-32deg) saturate(2.4)";
  g.drawImage(img, 0, 0);
  g.filter = "none";
  g.globalCompositeOperation = "source-atop";
  g.fillStyle = "rgba(214, 18, 12, 0.55)";
  g.fillRect(0, 0, c.width, c.height);
  return c;
}

function resetGame() {
  sun = START_SUN;
  treeHp = TREE_MAX;
  waveIndex = 0;
  phase = "intro";
  introT = PAUSE;
  monsters = [];
  shots = [];
  pulses = [];
  floats = [];
  towers = [null, null, null, null, null, null];
  selected = null;
  queue = [];
  spawnCd = 0;
  result = null;
  nextId = 1;
  treeShake = 0;
  toastT = 0;
  sheet.hidden = true;
  toastEl.hidden = true;
  paintHud();
  updateCards();
}

function paintHud() {
  sunEl.textContent = "阳光 " + sun;
  waveEl.textContent = "第" + (waveIndex + 1) + "/5波";
}

function updateCards() {
  cardWalk.classList.toggle("is-on", selected === "walk");
  cardYe.classList.toggle("is-on", selected === "ye");
  cardWalk.classList.toggle("poor", sun < COST_WALK);
  cardYe.classList.toggle("poor", sun < COST_YE);
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.hidden = false;
  toastT = 1.25;
}

function finish(kind) {
  if (result) return;
  result = kind;
  selected = null;
  updateCards();
  sheetTitle.textContent = kind === "win" ? "守住了" : "树被闯了";
  sheet.hidden = false;
  toastEl.hidden = true;
  toastT = 0;
}

function resize() {
  const rect = board.getBoundingClientRect();
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  if (layout && Math.abs(layout.w - w) < 0.5 && Math.abs(layout.h - h) < 0.5 && canvas.width > 0) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout = buildLayout(w, h);
  shots = [];
  pulses = [];
  syncMonsters();
}

function syncMonsters() {
  if (!layout) return;
  for (let i = 0; i < monsters.length; i++) {
    const p = pointAt(layout, monsters[i].u);
    monsters[i].x = p.x;
    monsters[i].y = p.y;
  }
}

function spawnMonster(kind) {
  const fast = kind === "f";
  const hp = fast ? 2 : 3;
  monsters.push({
    id: nextId++,
    fast: fast,
    hp: hp,
    maxHp: hp,
    u: 0,
    slow: 0,
    flash: 0,
    x: layout.pts[0].x,
    y: layout.pts[0].y
  });
}

function hurt(m) {
  if (m.hp <= 0) return;
  m.hp -= 1;
  m.flash = 0.12;
  if (m.hp <= 0) {
    m.hp = 0;
    sun += KILL_SUN;
    floats.push({ x: m.x, y: m.y, text: "+20", life: 0.85 });
  }
}

function step(dt) {
  if (!layout) return;
  time += dt;
  if (toastT > 0) {
    toastT -= dt;
    if (toastT <= 0) toastEl.hidden = true;
  }
  if (treeShake > 0) treeShake -= dt;
  for (let i = floats.length - 1; i >= 0; i--) {
    floats[i].life -= dt;
    floats[i].y -= 28 * dt;
    if (floats[i].life <= 0) floats.splice(i, 1);
  }
  for (let i = pulses.length - 1; i >= 0; i--) {
    pulses[i].life -= dt;
    if (pulses[i].life <= 0) pulses.splice(i, 1);
  }
  if (result) {
    paintHud();
    return;
  }

  if (phase === "intro") {
    introT -= dt;
    if (introT <= 0) {
      phase = "spawn";
      queue = WAVES[waveIndex].list.slice();
      spawnCd = 0.08;
    }
  } else if (phase === "spawn") {
    spawnCd -= dt;
    if (spawnCd <= 0 && queue.length) {
      spawnMonster(queue.shift());
      if (!queue.length) phase = "clear";
      else spawnCd = WAVES[waveIndex].gap;
    }
  }

  for (let i = 0; i < monsters.length; i++) {
    const m = monsters[i];
    if (m.hp <= 0) continue;
    let mult = m.fast ? FAST_MULT : 1;
    if (m.slow > 0) mult *= 0.5;
    m.u += dt * mult / WALK_SECONDS;
    if (m.slow > 0) m.slow -= dt;
    if (m.flash > 0) m.flash -= dt;
    if (m.u >= 1) {
      m.u = 1;
      m.hp = 0;
      if (!result) {
        treeHp -= 1;
        treeShake = 0.4;
        if (treeHp <= 0) {
          treeHp = 0;
          finish("lose");
        }
      }
    }
    const p = pointAt(layout, m.u);
    m.x = p.x;
    m.y = p.y;
  }
  monsters = monsters.filter((m) => m.hp > 0);
  if (result) {
    paintHud();
    return;
  }

  for (let i = 0; i < towers.length; i++) {
    const tower = towers[i];
    if (!tower) continue;
    const s = layout.slots[i];
    tower.cd -= dt;
    if (tower.cd > 0) continue;
    if (tower.kind === "walk") {
      let best = null;
      let bestD = layout.rangeWalk;
      for (let j = 0; j < monsters.length; j++) {
        const m = monsters[j];
        const d = Math.hypot(m.x - s.x, m.y - s.y);
        if (d <= bestD) {
          bestD = d;
          best = m;
        }
      }
      if (best) {
        shots.push({
          x: s.x,
          y: s.y - layout.slotR * 0.2,
          aimX: best.x,
          aimY: best.y,
          targetId: best.id,
          spin: 0,
          hitR: Math.max(12, layout.w * 0.04)
        });
        tower.cd = FIRE_WALK;
      }
    } else {
      let any = false;
      for (let j = 0; j < monsters.length; j++) {
        const m = monsters[j];
        const d = Math.hypot(m.x - s.x, m.y - s.y);
        if (d <= layout.rangeYe) {
          any = true;
          if (m.hp > 0) m.slow = m.slow > SLOW_TIME ? m.slow : SLOW_TIME;
          hurt(m);
        }
      }
      if (any) {
        pulses.push({ x: s.x, y: s.y, r: layout.rangeYe, life: 0.38, max: 0.38 });
        tower.cd = FIRE_YE;
      }
    }
  }

  const shotSpeed = SHOT_SPEED_F * layout.w;
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.spin += dt * 8;
    let tgt = null;
    for (let j = 0; j < monsters.length; j++) {
      if (monsters[j].id === s.targetId && monsters[j].hp > 0) {
        tgt = monsters[j];
        break;
      }
    }
    let tx = s.aimX;
    let ty = s.aimY;
    if (tgt) {
      tx = tgt.x;
      ty = tgt.y;
      s.aimX = tx;
      s.aimY = ty;
    }
    const dx = tx - s.x;
    const dy = ty - s.y;
    const dist = Math.hypot(dx, dy);
    const stepLen = shotSpeed * dt;
    if (dist <= Math.max(stepLen, s.hitR)) {
      if (tgt) hurt(tgt);
      shots.splice(i, 1);
    } else {
      s.x += (dx / dist) * stepLen;
      s.y += (dy / dist) * stepLen;
    }
  }
  monsters = monsters.filter((m) => m.hp > 0);

  if (!result && phase === "clear" && monsters.length === 0) {
    if (waveIndex >= WAVES.length - 1) finish("win");
    else {
      waveIndex += 1;
      phase = "intro";
      introT = PAUSE;
    }
  }
  paintHud();
}

function drawGrass() {
  const w = layout.w;
  const h = layout.h;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#8ed86a");
  g.addColorStop(1, "#5eae46");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 36; i++) {
    const x = ((i * 97) % 1000) / 1000 * w;
    const y = ((i * 57 + 30) % 1000) / 1000 * h;
    ctx.fillStyle = i % 2 === 0 ? "rgba(255,255,255,0.07)" : "rgba(30, 100, 30, 0.12)";
    ctx.beginPath();
    ctx.ellipse(x, y, 8 + (i % 5) * 4, 3 + (i % 3) * 2, (i % 7) * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawRoad() {
  const pts = layout.pts;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.strokeStyle = "#8a5a34";
  ctx.lineWidth = layout.road + 8;
  ctx.stroke();
  ctx.strokeStyle = "#d7b07a";
  ctx.lineWidth = layout.road;
  ctx.stroke();
  ctx.strokeStyle = "#e7c89a";
  ctx.lineWidth = layout.road * 0.42;
  ctx.stroke();
  ctx.setLineDash([7, 12]);
  ctx.strokeStyle = "rgba(120, 78, 40, 0.45)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawRanges() {
  if (!selected || result) return;
  const range = selected === "walk" ? layout.rangeWalk : layout.rangeYe;
  ctx.save();
  ctx.setLineDash([5, 6]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = selected === "walk" ? "rgba(36, 92, 170, 0.38)" : "rgba(180, 90, 20, 0.40)";
  for (let i = 0; i < layout.slots.length; i++) {
    if (towers[i]) continue;
    const s = layout.slots[i];
    ctx.beginPath();
    ctx.arc(s.x, s.y, range, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEmptySlot(s, hot) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.fillStyle = "rgba(255, 248, 220, 0.94)";
  ctx.beginPath();
  ctx.arc(0, 0, layout.slotR, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = hot ? 3 : 2.5;
  ctx.strokeStyle = hot ? "#e2ae00" : "#6a4a26";
  ctx.setLineDash([4, 3]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = hot ? "#9a6800" : "#6a4a26";
  ctx.lineWidth = 2.5;
  const p = layout.slotR * 0.36;
  ctx.beginPath();
  ctx.moveTo(-p, 0);
  ctx.lineTo(p, 0);
  ctx.moveTo(0, -p);
  ctx.lineTo(0, p);
  ctx.stroke();
  ctx.restore();
}

function drawHeroIcon(img, x, y, r) {
  const iw = img.naturalWidth;
  const ih = img.naturalHeight;
  const cropH = ih * 0.5;
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r * 0.9, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  const scale = (r * 2.15) / iw;
  const dw = iw * scale;
  const dh = cropH * scale;
  ctx.drawImage(img, 0, ih * 0.01, iw, cropH, x - dw / 2, y - r * 1.05, dw, dh);
  ctx.restore();
}

function drawTowers() {
  for (let i = 0; i < layout.slots.length; i++) {
    const s = layout.slots[i];
    const tower = towers[i];
    if (!tower) {
      drawEmptySlot(s, !!selected && !result);
      continue;
    }
    ctx.save();
    ctx.fillStyle = "rgba(70, 48, 24, 0.28)";
    ctx.beginPath();
    ctx.ellipse(s.x, s.y + layout.slotR * 0.72, layout.slotR * 0.85, layout.slotR * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    const pack = tower.kind === "walk" ? assets.walk : assets.victory;
    if (pack.ok) drawHeroIcon(pack.img, s.x, s.y, layout.slotR);
    else {
      ctx.fillStyle = tower.kind === "walk" ? "#2a3344" : "#f0d2a4";
      ctx.beginPath();
      ctx.arc(s.x, s.y, layout.slotR * 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(tower.kind === "walk" ? "黑" : "耶", s.x, s.y);
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, layout.slotR * 0.92, 0, Math.PI * 2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = tower.kind === "walk" ? "#1b1b1b" : "#e0b14a";
    ctx.stroke();
    ctx.restore();
  }
}

function drawTree() {
  const end = layout.pts[layout.pts.length - 1];
  const shake = treeShake > 0 ? Math.sin(treeShake * 40) * 4 : 0;
  const aspect = assets.tree.ok && assets.tree.img.naturalWidth
    ? assets.tree.img.naturalHeight / assets.tree.img.naturalWidth
    : 1019 / 1011;
  const dw = layout.treeW;
  const dh = dw * aspect;
  const x = end.x - dw / 2 + shake;
  const y = end.y - dh * 0.9;
  if (assets.tree.ok) {
    ctx.drawImage(assets.tree.img, x, y, dw, dh);
  } else if (assets.tree.failed) {
    const baseX = end.x + shake;
    ctx.fillStyle = "#8a5a32";
    ctx.fillRect(baseX - dw * 0.06, end.y - dh * 0.38, dw * 0.12, dh * 0.42);
    ctx.fillStyle = "#2f8a3a";
    ctx.beginPath();
    ctx.arc(baseX, end.y - dh * 0.5, dw * 0.22, 0, Math.PI * 2);
    ctx.arc(baseX - dw * 0.16, end.y - dh * 0.4, dw * 0.16, 0, Math.PI * 2);
    ctx.arc(baseX + dw * 0.16, end.y - dh * 0.4, dw * 0.16, 0, Math.PI * 2);
    ctx.fill();
  }
  const label = "树 " + treeHp + "/" + TREE_MAX;
  const labelY = Math.max(18, y - 8);
  ctx.font = "bold 16px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.lineWidth = 4;
  ctx.strokeStyle = "rgba(255,255,255,0.92)";
  ctx.fillStyle = "#163416";
  ctx.strokeText(label, end.x, labelY);
  ctx.fillText(label, end.x, labelY);
  const gap = 13;
  const pipY = labelY + 12;
  const start = end.x - ((TREE_MAX - 1) * gap) / 2;
  for (let i = 0; i < TREE_MAX; i++) {
    ctx.beginPath();
    ctx.arc(start + i * gap, pipY, 5, 0, Math.PI * 2);
    ctx.fillStyle = i < treeHp ? "#e23d3d" : "rgba(0,0,0,0.22)";
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
  }
}

function drawMonsterSprite(src, x, y, hgt) {
  const sw = src.naturalWidth || src.width;
  const sh = src.naturalHeight || src.height;
  const dw = hgt * (sw / sh);
  const bob = Math.sin(time * 9 + x * 0.02) * 1.5;
  ctx.drawImage(src, x - dw / 2, y - hgt * 0.78 + bob, dw, hgt);
}

function drawBlob(x, y, r, fast) {
  ctx.save();
  ctx.fillStyle = fast ? "#e23b1e" : "#f4a15a";
  ctx.beginPath();
  ctx.ellipse(x, y, r * 0.95, r, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(x - r * 0.28, y - r * 0.15, r * 0.2, 0, Math.PI * 2);
  ctx.arc(x + r * 0.26, y - r * 0.12, r * 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#2a1a12";
  ctx.beginPath();
  ctx.arc(x - r * 0.24, y - r * 0.12, r * 0.09, 0, Math.PI * 2);
  ctx.arc(x + r * 0.3, y - r * 0.09, r * 0.09, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawMonsters() {
  for (let i = 0; i < monsters.length; i++) {
    const m = monsters[i];
    ctx.save();
    ctx.fillStyle = "rgba(40, 70, 20, 0.2)";
    ctx.beginPath();
    ctx.ellipse(m.x, m.y + layout.monH * 0.22, layout.monH * 0.28, layout.monH * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    if (assets.monster.ok) {
      if (m.fast && assets.monster.tinted) {
        drawMonsterSprite(assets.monster.tinted, m.x, m.y, layout.monH);
      } else if (m.fast) {
        ctx.save();
        ctx.filter = "hue-rotate(-30deg) saturate(2.7)";
        drawMonsterSprite(assets.monster.img, m.x, m.y, layout.monH);
        ctx.restore();
      } else {
        drawMonsterSprite(assets.monster.img, m.x, m.y, layout.monH);
      }
    } else if (assets.monster.failed) {
      drawBlob(m.x, m.y, layout.monH * 0.42, m.fast);
    }
    if (m.flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + Math.min(0.7, m.flash * 4) + ")";
      ctx.beginPath();
      ctx.arc(m.x, m.y - layout.monH * 0.2, layout.monH * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }
    if (m.slow > 0) {
      ctx.strokeStyle = "rgba(80, 170, 255, 0.9)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(m.x, m.y - layout.monH * 0.15, layout.monH * 0.4, 0, Math.PI * 2);
      ctx.stroke();
    }
    const bw = layout.w * 0.09;
    const bh = 5;
    const bx = m.x - bw / 2;
    const by = m.y - layout.monH * 0.82;
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = m.fast ? "#ff5a3a" : "#8be06a";
    ctx.fillRect(bx, by, bw * Math.max(0, m.hp) / m.maxHp, bh);
    ctx.restore();
  }
}

function drawShots() {
  const size = Math.max(16, layout.w * 0.055);
  for (let i = 0; i < shots.length; i++) {
    const s = shots[i];
    if (assets.ball.ok) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.spin);
      ctx.drawImage(assets.ball.img, -size / 2, -size / 2, size, size);
      ctx.restore();
    } else if (assets.ball.failed) {
      ctx.fillStyle = "#f2c230";
      ctx.beginPath();
      ctx.arc(s.x, s.y, size * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPulses() {
  for (let i = 0; i < pulses.length; i++) {
    const p = pulses[i];
    const k = 1 - p.life / p.max;
    const alpha = 0.7 * (1 - k);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.45 + 0.55 * k), 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255, 190, 70, " + alpha + ")";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = "rgba(255, 220, 120, " + (0.16 * (1 - k)) + ")";
    ctx.fill();
  }
}

function drawFloats() {
  ctx.textAlign = "center";
  ctx.font = "bold 15px sans-serif";
  for (let i = 0; i < floats.length; i++) {
    const f = floats[i];
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.fillStyle = "#c47d12";
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillText(f.text, f.x, f.y);
  }
}

function drawBanner() {
  if (phase !== "intro" || result) return;
  const text = "第" + (waveIndex + 1) + "波";
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold 40px sans-serif";
  const x = layout.w * 0.5;
  const y = layout.h * 0.46;
  ctx.fillStyle = "rgba(255, 250, 235, 0.82)";
  const tw = ctx.measureText(text).width;
  roundRect(x - tw / 2 - 18, y - 28, tw + 36, 56, 14);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#e2b84a";
  ctx.stroke();
  ctx.fillStyle = "#1d4a18";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawWinBoy() {
  if (result !== "win" || !assets.victory.ok) return;
  const end = layout.pts[layout.pts.length - 1];
  const img = assets.victory.img;
  const bh = layout.w * 0.42;
  const bw = bh * (img.naturalWidth / img.naturalHeight);
  const foot = Math.min(layout.h - 2, end.y + layout.w * 0.03);
  ctx.save();
  ctx.fillStyle = "rgba(40, 50, 20, 0.25)";
  ctx.beginPath();
  ctx.ellipse(end.x, foot - 2, bw * 0.28, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.drawImage(img, end.x - bw / 2, foot - bh, bw, bh);
  ctx.restore();
}

function draw() {
  if (!layout) return;
  ctx.clearRect(0, 0, layout.w, layout.h);
  drawGrass();
  drawRoad();
  drawRanges();
  drawTree();
  drawMonsters();
  drawShots();
  drawPulses();
  drawTowers();
  drawFloats();
  drawBanner();
  drawWinBoy();
}

function frame(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;
  step(dt);
  draw();
  requestAnimationFrame(frame);
}

function boardPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (layout.w / r.width),
    y: (e.clientY - r.top) * (layout.h / r.height)
  };
}

function onCard(kind) {
  if (result) return;
  selected = selected === kind ? null : kind;
  updateCards();
}

function onBoardPointer(e) {
  if (!layout || result) return;
  const p = boardPos(e);
  let hit = -1;
  let best = layout.slotR * 1.5;
  for (let i = 0; i < layout.slots.length; i++) {
    const s = layout.slots[i];
    const d = Math.hypot(s.x - p.x, s.y - p.y);
    if (d <= best) {
      best = d;
      hit = i;
    }
  }
  if (hit < 0) return;
  if (towers[hit]) return;
  if (!selected) return;
  const cost = selected === "walk" ? COST_WALK : COST_YE;
  if (sun < cost) {
    showToast("阳光不足");
    return;
  }
  sun -= cost;
  towers[hit] = { kind: selected, cd: 0 };
  paintHud();
  updateCards();
}

cardWalk.addEventListener("pointerup", function (e) {
  e.preventDefault();
  onCard("walk");
});
cardYe.addEventListener("pointerup", function (e) {
  e.preventDefault();
  onCard("ye");
});
canvas.addEventListener("pointerup", function (e) {
  onBoardPointer(e);
});
canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
retryBtn.addEventListener("pointerup", function (e) {
  e.preventDefault();
  e.stopPropagation();
  resetGame();
});
window.addEventListener("resize", resize);
if (window.ResizeObserver) {
  const ro = new ResizeObserver(function () { resize(); });
  ro.observe(board);
}
resetGame();
resize();
requestAnimationFrame(frame);
</script>
