<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>蓝衣射击</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #102433;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #sheet {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(18, 36, 52, 0.46);
  }
  #sheet.open { display: flex; }
  .card {
    background: #fffdf8;
    border-radius: 20px;
    padding: 28px 36px 24px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
    min-width: 220px;
  }
  .card h2 {
    margin: 0 0 18px;
    font-size: 32px;
    color: #1d3557;
    letter-spacing: 2px;
  }
  #again {
    appearance: none;
    border: 0;
    background: #1d9bf0;
    color: white;
    font-size: 20px;
    padding: 12px 28px;
    border-radius: 999px;
    font-family: inherit;
    cursor: pointer;
  }
  #again:active { transform: scale(0.98); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="sheet">
  <div class="card">
    <h2 id="sheet-title">过关</h2>
    <button id="again" type="button">再玩一次</button>
  </div>
</div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var sheet = document.getElementById("sheet");
  var sheetTitle = document.getElementById("sheet-title");
  var againBtn = document.getElementById("again");

  // boy_shoot.gif is 7 frames, all 522×780.
  // Frame 0 is idle (gun hanging). Frames 1–6 raise the gun and shoot right.
  // Durations: 130, 130, 80, 80, 100, 180 ms.
  // Muzzle of the raised gun sits near source (432, 260). That point tracks the finger.
  var SRC_W = 522;
  var SRC_H = 780;
  var MUZZLE_X = 432;
  var MUZZLE_Y = 260;
  var SPRITE_LEFT = 6;
  var SHOOT_DURS = [0.13, 0.13, 0.08, 0.08, 0.10, 0.18];
  var SHOT_INTERVAL = 0.35;
  var NORMAL_ASPECT = 178 / 384;
  var FAST_ASPECT = 110 / 384;

  var WAVES = [
    { interval: 1.2, list: ["n", "n", "n", "n", "n", "n"] },
    { interval: 1.05, list: ["n", "n", "n", "n", "n", "n", "n", "n"] },
    { interval: 0.95, list: ["n", "n", "n", "n", "n", "n", "n", "n", "n"] },
    { interval: 0.8, list: ["n", "n", "f", "n", "f", "n", "f", "n", "f", "n"] },
    { interval: 0.7, list: ["f", "n", "f", "n", "f", "n", "f", "n", "f", "n", "f"] }
  ];

  var imgs = { right: [] };
  var viewW = 0;
  var viewH = 0;
  var boardX = 0;
  var boardY = 0;
  var boardW = 0;
  var boardH = 0;
  var marginY = 16;
  var monW = 120;
  var playerY = 0;
  var playerRatio = 0.5;
  var lives = 5;
  var wave = 0;
  var phase = "banner";
  var phaseT = 0;
  var spawnIndex = 0;
  var spawnT = 0;
  var monsters = [];
  var bullets = [];
  var shooting = false;
  var shotCd = 0;
  var animIndex = -1;
  var animTime = 0;
  var over = null;
  var hurtT = 0;
  var movePointer = null;
  var moveLastY = 0;
  var shootPointer = null;
  var mouseShoot = false;
  var keyShoot = false;
  var keys = { up: false, down: false };
  var ready = false;

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error(src)); };
      img.src = src;
    });
  }

  function layout() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    canvas.width = Math.max(1, Math.round(viewW * dpr));
    canvas.height = Math.max(1, Math.round(viewH * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (viewW >= viewH) {
      boardX = 0;
      boardY = 0;
      boardW = viewW;
      boardH = viewH;
    } else {
      var aspect = 16 / 9;
      boardW = viewW;
      boardH = viewW / aspect;
      if (boardH > viewH) {
        boardH = viewH;
        boardW = viewH * aspect;
      }
      boardX = (viewW - boardW) / 2;
      boardY = (viewH - boardH) / 2;
    }

    marginY = Math.max(12, boardH * 0.045);
    // Enemy width is about 11% of the board, not the old ~20%.
    monW = boardW * 0.11;
    playerY = clampY(playerRatio * boardH);
  }

  function clampY(y) {
    var lo = marginY;
    var hi = boardH - marginY;
    if (hi < lo) hi = lo;
    if (y < lo) y = lo;
    if (y > hi) y = hi;
    return y;
  }

  function setPlayerY(y) {
    if (!(boardH > 0)) return;
    playerY = clampY(y);
    playerRatio = boardH > 0 ? playerY / boardH : 0.5;
  }

  function pointY(e) {
    var rect = canvas.getBoundingClientRect();
    return e.clientY - rect.top - boardY;
  }

  function sheetOpen() {
    return sheet.classList.contains("open");
  }

  function startWave(index) {
    wave = index;
    phase = "banner";
    phaseT = index === 0 ? 1.8 : 2.5;
    spawnIndex = 0;
    spawnT = 0;
  }

  function resetGame() {
    lives = 5;
    monsters = [];
    bullets = [];
    shooting = false;
    shotCd = 0;
    animIndex = -1;
    animTime = 0;
    over = null;
    hurtT = 0;
    movePointer = null;
    shootPointer = null;
    mouseShoot = false;
    keyShoot = false;
    keys.up = false;
    keys.down = false;
    playerRatio = 0.5;
    playerY = clampY(boardH * 0.5);
    sheet.classList.remove("open");
    startWave(0);
  }

  function endGame(kind) {
    if (over) return;
    over = kind;
    shooting = false;
    sheetTitle.textContent = kind === "win" ? "过关" : "被冲过来了";
    sheet.classList.add("open");
  }

  function isPortrait() {
    return viewH > viewW;
  }

  // Display height is 32% of the board (was min(boardH * 0.78, boardW * 0.52)).
  function boyScale() {
    return (boardH * 0.32) / SRC_H;
  }

  // Previous height, only so the feet stay on the old foot line.
  function legacyBoyHeight() {
    return Math.min(boardH * 0.78, boardW * 0.52);
  }

  function boyPose() {
    var sc = boyScale();
    var oldSc = legacyBoyHeight() / SRC_H;
    var foot = playerY + (SRC_H - MUZZLE_Y) * oldSc;
    var top = foot - SRC_H * sc;
    return {
      sc: sc,
      top: top,
      foot: foot,
      muzzleX: SPRITE_LEFT + MUZZLE_X * sc,
      muzzleY: top + MUZZLE_Y * sc
    };
  }

  function monsterBox(kind) {
    var w = monW;
    var h = w * (kind === "f" ? FAST_ASPECT : NORMAL_ASPECT);
    return { w: w, h: h };
  }

  function spawnMonster(kind) {
    var box = monsterBox(kind);
    var lo = marginY;
    var hi = Math.max(lo, boardH - marginY);
    function pick() {
      return lo + Math.random() * Math.max(1, hi - lo);
    }
    var y = pick();
    var x0 = boardW + box.w * 0.55;
    var guard = 0;
    while (guard < 8) {
      var crowded = false;
      for (var i = 0; i < monsters.length; i++) {
        var other = monsterBox(monsters[i].kind);
        var dy = Math.abs(monsters[i].y - y);
        var dx = Math.abs(monsters[i].x - x0);
        if (dy < (box.h + other.h) * 0.62 && dx < (box.w + other.w) * 0.55) {
          crowded = true;
          break;
        }
      }
      if (!crowded) break;
      y = pick();
      guard++;
    }
    var fast = kind === "f";
    monsters.push({
      kind: kind,
      x: x0,
      y: y,
      hp: fast ? 2 : 3,
      maxHp: fast ? 2 : 3,
      speed: (boardW / 9) * (fast ? 1.6 : 1),
      flash: 0
    });
  }

  function monsterHit(b, m) {
    var box = monsterBox(m.kind);
    var dx = b.x - m.x;
    var dy = b.y - m.y;
    var rx = box.w * 0.46 + b.r * 0.25;
    var ry = box.h * (m.kind === "f" ? 0.36 : 0.40) + b.r * 0.25;
    return (dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) <= 1;
  }

  function restartAnim() {
    animIndex = 0;
    animTime = 0;
  }

  function advanceAnim(dt) {
    if (animIndex < 0) return;
    animTime += dt;
    while (animIndex >= 0 && animTime >= SHOOT_DURS[animIndex]) {
      animTime -= SHOOT_DURS[animIndex];
      animIndex += 1;
      if (animIndex >= SHOOT_DURS.length) {
        animIndex = -1;
        animTime = 0;
        break;
      }
    }
  }

  function fire() {
    var pose = boyPose();
    bullets.push({
      x: pose.muzzleX,
      y: pose.muzzleY,
      vx: boardW / 0.58,
      r: Math.max(5, boardH * 0.014)
    });
    restartAnim();
  }

  function maybeAdvance() {
    if (over) return;
    if (phase !== "spawn") return;
    if (spawnIndex < WAVES[wave].list.length) return;
    if (monsters.length > 0) return;
    if (wave >= WAVES.length - 1) endGame("win");
    else startWave(wave + 1);
  }

  function update(dt) {
    if (!ready || over || isPortrait()) return;
    hurtT = Math.max(0, hurtT - dt);
    advanceAnim(dt);

    var keyDir = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (keyDir) setPlayerY(playerY + keyDir * (boardH / 0.45) * dt);

    if (shooting) {
      shotCd -= dt;
      while (shotCd <= 0) {
        fire();
        shotCd += SHOT_INTERVAL;
      }
    } else {
      shotCd = 0;
    }

    if (phase === "banner") {
      phaseT -= dt;
      if (phaseT <= 0) {
        phase = "spawn";
        spawnT = 0;
      }
    } else if (phase === "spawn") {
      var spec = WAVES[wave];
      spawnT -= dt;
      while (spawnIndex < spec.list.length && spawnT <= 0) {
        spawnMonster(spec.list[spawnIndex]);
        spawnIndex++;
        spawnT += spec.interval;
      }
    }

    for (var j = monsters.length - 1; j >= 0; j--) {
      var mon = monsters[j];
      mon.x -= mon.speed * dt;
      mon.flash = Math.max(0, mon.flash - dt);
      var box = monsterBox(mon.kind);
      if (mon.x - box.w / 2 <= 0) {
        monsters.splice(j, 1);
        lives -= 1;
        hurtT = 0.28;
        if (lives <= 0) {
          lives = 0;
          endGame("lose");
          return;
        }
      }
    }

    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt;
      if (b.x > boardW + 40) {
        bullets.splice(i, 1);
        continue;
      }
      var hit = false;
      for (var k = monsters.length - 1; k >= 0; k--) {
        var m2 = monsters[k];
        if (monsterHit(b, m2)) {
          m2.hp -= 1;
          m2.flash = 0.1;
          hit = true;
          if (m2.hp <= 0) monsters.splice(k, 1);
          break;
        }
      }
      if (hit) bullets.splice(i, 1);
    }

    maybeAdvance();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function uiScale() {
    var s = boardH / 420;
    if (s < 0.7) s = 0.7;
    if (s > 1.2) s = 1.2;
    return s;
  }

  function drawBackground() {
    var sky = ctx.createLinearGradient(0, 0, 0, boardH);
    sky.addColorStop(0, "#8fd3f0");
    sky.addColorStop(0.72, "#d7f3c8");
    sky.addColorStop(1, "#b7e39a");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, boardW, boardH);

    ctx.fillStyle = "rgba(255,255,255,0.85)";
    var clouds = [
      [0.22, 0.18, 0.12],
      [0.55, 0.30, 0.09],
      [0.82, 0.16, 0.13]
    ];
    for (var i = 0; i < clouds.length; i++) {
      var cx = clouds[i][0] * boardW;
      var cy = clouds[i][1] * boardH;
      var cw = clouds[i][2] * boardH;
      ctx.beginPath();
      ctx.ellipse(cx, cy, cw, cw * 0.42, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + cw * 0.55, cy + cw * 0.08, cw * 0.72, cw * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (hurtT > 0) {
      var flash = ctx.createLinearGradient(0, 0, boardW * 0.28, 0);
      flash.addColorStop(0, "rgba(226, 61, 61, 0.45)");
      flash.addColorStop(1, "rgba(226, 61, 61, 0)");
      ctx.fillStyle = flash;
      ctx.fillRect(0, 0, boardW * 0.28, boardH);
    }
  }

  function drawMonsters() {
    for (var i = 0; i < monsters.length; i++) {
      var m = monsters[i];
      var img = m.kind === "f" ? imgs.fast : imgs.enemy;
      var box = monsterBox(m.kind);
      var bob = Math.sin(m.x * 0.04) * 1.5;
      ctx.save();
      if (m.flash > 0) ctx.filter = "brightness(1.8)";
      ctx.drawImage(img, m.x - box.w / 2, m.y - box.h / 2 + bob, box.w, box.h);
      ctx.restore();
      var pip = Math.max(4, box.h * 0.09);
      var gap = pip * 0.7;
      var total = m.maxHp * pip * 2 + (m.maxHp - 1) * gap;
      var px = m.x - total / 2;
      var py = m.y - box.h / 2 - pip - 4 + bob;
      for (var p = 0; p < m.maxHp; p++) {
        ctx.beginPath();
        ctx.fillStyle = p < m.hp ? "#e23d3d" : "rgba(255,255,255,0.7)";
        ctx.arc(px + pip + p * (pip * 2 + gap), py, pip, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawBullets() {
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.fillStyle = "rgba(255, 225, 74, 0.9)";
      ctx.fillRect(b.x - b.r * 3.2, b.y - b.r * 0.38, b.r * 2.4, b.r * 0.76);
      ctx.fillStyle = "#ffe14a";
      ctx.strokeStyle = "#8a6a10";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawBoy() {
    var pose = boyPose();
    var img = animIndex < 0 ? imgs.idle : imgs.right[animIndex];
    ctx.drawImage(img, SPRITE_LEFT, pose.top, SRC_W * pose.sc, SRC_H * pose.sc);
  }

  function drawHud() {
    var s = uiScale();
    ctx.fillStyle = "#16324f";
    ctx.font = "700 " + Math.round(22 * s) + "px 'PingFang SC','Noto Sans SC',sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("蓝衣射击", 14, 10);

    ctx.textAlign = "right";
    ctx.font = "700 " + Math.round(18 * s) + "px 'PingFang SC','Noto Sans SC',sans-serif";
    ctx.fillText("第" + (wave + 1) + "/5波", boardW - 14, 12);

    var pipY = 14 + Math.round(34 * s);
    var pipR = Math.max(5, 7 * s);
    for (var i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.fillStyle = i < lives ? "#e23d3d" : "rgba(255,255,255,0.55)";
      ctx.strokeStyle = "#16324f";
      ctx.lineWidth = 2;
      ctx.arc(18 + i * (pipR * 2 + 4), pipY, pipR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.fillStyle = "#16324f";
    ctx.textAlign = "left";
    ctx.font = "600 " + Math.round(15 * s) + "px 'PingFang SC','Noto Sans SC',sans-serif";
    ctx.fillText("生命 " + lives + "/5", 18 + 5 * (pipR * 2 + 4) + 6, pipY - pipR);

    ctx.textAlign = "center";
    ctx.font = "600 " + Math.round(15 * s) + "px 'PingFang SC','Noto Sans SC',sans-serif";
    ctx.fillStyle = "rgba(22,50,79,0.88)";
    ctx.fillText("左半屏上下拖，右半屏按住开枪", boardW / 2, boardH - Math.round(26 * s));

    if (phase === "banner" && !over) {
      ctx.fillStyle = "rgba(255,253,248,0.92)";
      var bw = Math.round(168 * s);
      var bh = Math.round(64 * s);
      var by = boardH * 0.36;
      roundRect(boardW / 2 - bw / 2, by, bw, bh, 16);
      ctx.fill();
      ctx.fillStyle = "#1d3557";
      ctx.font = "800 " + Math.round(32 * s) + "px 'PingFang SC','Noto Sans SC',sans-serif";
      ctx.textBaseline = "middle";
      ctx.fillText("第" + (wave + 1) + "波", boardW / 2, by + bh / 2);
      ctx.textBaseline = "top";
    }
  }

  function drawRotatePrompt() {
    ctx.fillStyle = "#102433";
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.fillStyle = "#f4fbff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var s = Math.min(viewW, viewH) / 320;
    ctx.font = "700 " + Math.round(28 * s) + "px 'PingFang SC','Noto Sans SC',sans-serif";
    ctx.fillText("把手机横过来", viewW / 2, viewH / 2);
  }

  function draw() {
    ctx.fillStyle = "#102433";
    ctx.fillRect(0, 0, viewW, viewH);
    if (isPortrait()) {
      drawRotatePrompt();
      return;
    }
    if (!ready) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(boardX, boardY, boardW, boardH);
    ctx.clip();
    ctx.translate(boardX, boardY);
    drawBackground();
    drawMonsters();
    drawBullets();
    drawBoy();
    drawHud();
    ctx.restore();
  }

  function pointX(e) {
    var rect = canvas.getBoundingClientRect();
    return e.clientX - rect.left - boardX;
  }

  function syncShooting() {
    shooting = mouseShoot || keyShoot || shootPointer !== null;
  }

  function onDown(e) {
    if (sheetOpen() || isPortrait()) return;
    if (e.pointerType === "mouse") {
      if (e.button !== 0) return;
      mouseShoot = true;
      syncShooting();
      return;
    }
    var x = pointX(e);
    if (x < boardW / 2) {
      if (movePointer !== null) return;
      movePointer = e.pointerId;
      moveLastY = pointY(e);
    } else {
      if (shootPointer !== null) return;
      shootPointer = e.pointerId;
      syncShooting();
    }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function onMove(e) {
    if (sheetOpen() || isPortrait()) return;
    if (e.pointerType === "mouse") return;
    if (movePointer !== null && e.pointerId === movePointer) {
      var y = pointY(e);
      setPlayerY(playerY + (y - moveLastY));
      moveLastY = y;
    }
  }

  function onUp(e) {
    if (e.pointerType === "mouse") {
      if (e.button !== 0) return;
      mouseShoot = false;
      syncShooting();
      return;
    }
    if (movePointer !== null && e.pointerId === movePointer) movePointer = null;
    if (shootPointer !== null && e.pointerId === shootPointer) {
      shootPointer = null;
      syncShooting();
    }
  }

  function onKeyDown(e) {
    if (sheetOpen() || isPortrait()) return;
    if (e.code === "ArrowUp" || e.code === "KeyW") {
      keys.up = true;
      e.preventDefault();
    } else if (e.code === "ArrowDown" || e.code === "KeyS") {
      keys.down = true;
      e.preventDefault();
    } else if (e.code === "Space") {
      if (!keyShoot) keyShoot = true;
      syncShooting();
      e.preventDefault();
    }
  }

  function onKeyUp(e) {
    if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = false;
    else if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = false;
    else if (e.code === "Space") {
      keyShoot = false;
      syncShooting();
    }
  }

  canvas.addEventListener("pointerdown", onDown);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("keyup", onKeyUp);
  window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener("resize", layout);

  againBtn.addEventListener("click", function (e) {
    e.preventDefault();
    e.stopPropagation();
    resetGame();
  });

  var last = 0;
  function loop(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  Promise.all([
    loadImage("boy_idle.png"),
    loadImage("boy_right_1.png"),
    loadImage("boy_right_2.png"),
    loadImage("boy_right_3.png"),
    loadImage("boy_right_4.png"),
    loadImage("boy_right_5.png"),
    loadImage("boy_right_6.png"),
    loadImage("shooter_enemy.png"),
    loadImage("shooter_enemy_fast.png")
  ]).then(function (list) {
    imgs.idle = list[0];
    imgs.right = [list[1], list[2], list[3], list[4], list[5], list[6]];
    imgs.enemy = list[7];
    imgs.fast = list[8];
    layout();
    resetGame();
    ready = true;
    requestAnimationFrame(loop);
  }).catch(function () {
    layout();
    ctx.fillStyle = "#f4fbff";
    ctx.font = "18px sans-serif";
    ctx.fillText("图片没有载入", 20, 40);
  });
})();
</script>
</body>
</html>
