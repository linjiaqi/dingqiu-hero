<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>快进桶</title>
<style>
html,body{margin:0;height:100%;background:#87c8ef;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#b7e3fb;touch-action:none}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.38)}
#sheet{background:#fff;border-radius:18px;padding:26px 34px;text-align:center}
#sheet h2{margin:0 0 8px;font-size:28px}
#sheet p{font-size:22px;margin:8px 0 18px}
#again{font-size:20px;padding:10px 26px;border:0;border-radius:12px;background:#ff9f1c;color:#fff}
#sel{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(#b7e3fb,#8ed36a);z-index:4}
#sel h1{margin:0;font-size:34px;color:#16324a;letter-spacing:2px}
#sel .tip{margin:0;color:#24506e;font-size:15px}
#cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.card{width:100px;padding:8px 6px 10px;border:3px solid transparent;border-radius:16px;background:rgba(255,255,255,.85);text-align:center;font-size:15px;color:#16324a}
.card canvas{display:block;width:88px;height:110px;margin:0 auto 6px;border-radius:10px;background:#e8f4fb}
.card.on{border-color:#ff9f1c;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#start{font-size:22px;padding:12px 44px;border:0;border-radius:14px;background:#ff9f1c;color:#fff;opacity:.45}
#start.ready{opacity:1}
#sheet .row{display:flex;gap:12px;justify-content:center}
#swap{font-size:20px;padding:10px 20px;border:0;border-radius:12px;background:#4d96ff;color:#fff}
#mute{position:fixed;z-index:5;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.82);font-size:18px;line-height:36px;text-align:center}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="mute" type="button" aria-label="静音">🔊</button>
<div id="over"><div id="sheet"><h2>结束啦</h2><p id="sc">得分 0</p><div class="row"><button id="again" type="button">再玩</button><button id="swap" type="button">换人物</button></div></div></div>
<div id="sel"><h1>快进桶</h1><p class="tip">选一个人物</p><div id="cards"></div><button id="start" type="button">开始</button></div>
<script>
const W = 360, H = 640, GROUND = 600, PLATFORM = 188, BOY_H = 118;
// 车必须整辆落在屏幕里，所以按宽度缩小，不再为了对齐钩子把整车放大。
// 钩口用臂端空档 (690,260)，提手用桶身和把手之间的杆 (300,210)。桶镜像后提手在左侧。
// 桶按同一地面缩放，让钩口高度刚好落到这根杆上。
const TRUCK_IW = 760, TRUCK_IH = 389, TRUCK_FOOT = 383;
const HOOK_IX = 690, HOOK_IY = 260;
const ST = 304 / TRUCK_IW;
const TRUCK_W = TRUCK_IW * ST, TRUCK_H = TRUCK_IH * ST;
const TRUCK_TOP = GROUND - TRUCK_FOOT * ST;
const BIN_IW = 420, BIN_IH = 478, BIN_FOOT = 472;
const MOUTH_L = 71, MOUTH_R = 314, RIM_IY = 70;
const HANDLE_IX = 300, HANDLE_IY = 210;
const SB = ST * (TRUCK_FOOT - HOOK_IY) / (BIN_FOOT - HANDLE_IY);
const BIN_W = BIN_IW * SB;
const BIN_H = BIN_IH * SB;
const BIN_TOP = GROUND - BIN_FOOT * SB;
const RIM_Y = BIN_TOP + RIM_IY * SB;
const HANDLE_DX = BIN_W / 2 - HANDLE_IX * SB;
const HOOK_DX = HOOK_IX * ST;
const LID_H = 94 * SB;
const LID_Y = BIN_TOP + 6 * SB;
const MOUTH_LEFT = (binX) => binX + BIN_W / 2 - MOUTH_R * SB;
const MOUTH_RIGHT = (binX) => binX + BIN_W / 2 - MOUTH_L * SB;
const MOUTH_CX = (binX) => (MOUTH_LEFT(binX) + MOUTH_RIGHT(binX)) / 2;
function binForTruck(tx) { return tx - HANDLE_DX + HOOK_DX; }
function binDockMin() { return Math.max(BIN_W / 2 + 4, binForTruck(6)); }
function binDockMax() { return Math.min(W - BIN_W / 2 - 4, binForTruck(W - 6 - TRUCK_W)); }
const WALK_V = 92, GRAV = 1700, HOP = -210;
const BIN_V0 = 64, BIN_STEP = 16, BIN_GAP = 250;
const IN_PEEK = 0.40;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H), d = devicePixelRatio || 1;
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  cv.width = Math.round(W * d);
  cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  const rc = cv.getBoundingClientRect();
  const m = document.getElementById('mute');
  m.style.top = (rc.top + 8 * s) + 'px';
  m.style.left = (rc.right - 8 * s - 36) + 'px';
}
addEventListener('resize', fit);
fit();

const img = {};
function loadImg(name, done) {
  const im = new Image();
  im.onload = () => { img[name] = im; if (done) done(); };
  im.onerror = () => {};
  im.src = './' + name + '.png';
}
['bin', 'bin_lid', 'truck'].forEach(n => loadImg(n));

// 三个人物，文件名互不串用。静态图缺了就回退 boy_stripe.png，再缺就画色块。
const STATES = ['walk', 'fall', 'miss', 'in'];
const CHARS = {
  stripe: { name: '条纹衫', still: 'boy_stripe', color: '#2f7d5b' },
  jacket: { name: '黑外套', still: 'boy_jacket', color: '#33363d' },
  pilot: { name: '蓝机场同服', still: 'boy_pilot', color: '#3a6fc4' }
};
const CHAR_IDS = Object.keys(CHARS);
const CHAR_KEY = 'kuaijintong_char';
let charId = 'stripe';
try { const v = localStorage.getItem(CHAR_KEY); if (CHARS[v]) charId = v; } catch (e) {}
CHAR_IDS.forEach(id => loadImg(CHARS[id].still, () => drawCards()));

const ANIMS = {};
CHAR_IDS.forEach(id => { ANIMS[id] = { walk: [], fall: [], miss: [], in: [] }; });
fetch('./frames.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : {}).then(data => {
  CHAR_IDS.forEach(id => {
    const group = data && typeof data[id] === 'object' ? data[id] : {};
    STATES.forEach(key => {
      const list = Array.isArray(group[key]) ? group[key] : [];
      ANIMS[id][key] = list.filter(f => f && f.file).map(f => {
        const slot = { img: null, ms: +f.ms > 0 ? +f.ms : 100 };
        const im = new Image();
        im.onload = () => { slot.img = im; };
        im.onerror = () => { slot.bad = true; };
        im.src = './' + f.file;
        return slot;
      });
    });
  });
}).catch(() => {});

function animReady(key) {
  const a = ANIMS[charId][key];
  return a.length > 0 && a.every(f => f.img);
}
function animMs(key) {
  return animReady(key) ? ANIMS[charId][key].reduce((s, f) => s + f.ms, 0) : 0;
}
function poseMs(key) {
  if (!animReady(key)) return 0;
  const a = ANIMS[charId][key];
  let n = a.length;
  if (n > 1 && a[n - 1].ms >= 1000) n -= 1;
  let ms = 0;
  for (let i = 0; i < n; i++) ms += a[i].ms;
  return ms;
}
function animFrame(key, t, loop) {
  const a = ANIMS[charId][key];
  const total = animMs(key);
  let ms = t * 1000;
  if (loop) ms %= total;
  else if (ms >= total) return a[a.length - 1].img;
  for (let i = 0; i < a.length; i++) {
    if (ms < a[i].ms) return a[i].img;
    ms -= a[i].ms;
  }
  return a[a.length - 1].img;
}

const SND_KEY = 'kuaijintong_muted';
let AC = null, master = null, muted = false, engine = null;
try { muted = localStorage.getItem(SND_KEY) === '1'; } catch (e) {}
function unlock() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    if (!AC) {
      AC = new C();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.2;
      master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume().catch(() => {});
  } catch (e) { AC = null; }
}
function audible() { return AC && master && AC.state === 'running'; }
function env(g, t, dur, v) {
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + 0.01);
  g.gain.linearRampToValueAtTime(0, t + dur);
}
function tone(type, f0, f1, dur, v, delay) {
  if (!audible()) return;
  try {
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    env(g, t, dur, v);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noise(dur, freq, v, delay) {
  if (!audible()) return;
  try {
    const t = AC.currentTime + (delay || 0);
    const n = Math.ceil(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, n, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = buf;
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    env(g, t, dur, v);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  } catch (e) {}
}
const SFX = {
  jump() { tone('square', 720, 380, 0.09, 0.28); tone('triangle', 480, 260, 0.1, 0.2, 0.06); },
  in() { tone('sine', 160, 55, 0.2, 0.9); noise(0.08, 280, 0.25); },
  lid() { noise(0.035, 3200, 0.55); tone('square', 1600, 900, 0.03, 0.12); },
  horn() {
    tone('square', 440, 440, 0.16, 0.16);
    tone('square', 554, 554, 0.16, 0.12);
    tone('square', 440, 440, 0.2, 0.16, 0.22);
    tone('square', 554, 554, 0.2, 0.12, 0.22);
  },
  miss() { noise(0.08, 700, 0.45); tone('sine', 220, 110, 0.1, 0.3); },
  score() { tone('triangle', 660, 660, 0.09, 0.4); tone('triangle', 990, 990, 0.14, 0.4, 0.08); },
  over() { tone('triangle', 520, 160, 0.55, 0.45); }
};
function engineOn() {
  if (engine || !audible()) return;
  try {
    const t = AC.currentTime;
    const o = AC.createOscillator(), l = AC.createOscillator();
    const lg = AC.createGain(), f = AC.createBiquadFilter(), g = AC.createGain(), am = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 52;
    l.frequency.value = 7; lg.gain.value = 0.22;
    f.type = 'lowpass'; f.frequency.value = 300;
    am.gain.value = 0.7;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.28, t + 0.08);
    l.connect(lg); lg.connect(am.gain);
    o.connect(f); f.connect(am); am.connect(g); g.connect(master);
    o.start(); l.start();
    engine = { o, l, g };
  } catch (e) { engine = null; }
}
function engineOff() {
  if (!engine) return;
  const e = engine; engine = null;
  try {
    const t = AC.currentTime;
    e.g.gain.cancelScheduledValues(t);
    e.g.gain.setValueAtTime(e.g.gain.value, t);
    e.g.gain.linearRampToValueAtTime(0, t + 0.08);
    e.o.stop(t + 0.1); e.l.stop(t + 0.1);
  } catch (e2) {}
}

const muteBtn = document.getElementById('mute');
function showMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
showMute();
['pointerdown', 'touchstart', 'mousedown', 'click'].forEach(n => {
  muteBtn.addEventListener(n, e => e.stopPropagation());
});
muteBtn.addEventListener('click', e => {
  e.preventDefault();
  unlock();
  muted = !muted;
  try { localStorage.setItem(SND_KEY, muted ? '1' : '0'); } catch (err) {}
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.2, AC.currentTime, 0.02);
  showMute();
  muteBtn.blur();
});
['pointerdown', 'touchstart', 'keydown'].forEach(n => {
  addEventListener(n, unlock, { capture: true, passive: true });
});

let st;
function binSpeed() { return BIN_V0 + BIN_STEP * Math.floor(st.score / 3); }
function makeBin(x) { return { x: x, lid: 0, hold: false }; }
let phase = 'select';
function reset() {
  engineOff();
  phase = 'play';
  st = {
    score: 0, chances: 3, over: false, hint: true,
    boy: { x: W * 0.35, y: PLATFORM, vy: 0, dir: 1, mode: 'walk', t: 0, bin: null },
    bins: [makeBin(W * 0.72)],
    truck: null
  };
  document.getElementById('over').style.display = 'none';
}
function jump() {
  const b = st.boy;
  if (phase !== 'play' || st.over || b.mode !== 'walk') return;
  b.mode = 'fall';
  b.vy = HOP;
  b.t = 0;
  b.y = PLATFORM;
  st.hint = false;
  SFX.jump();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat) return;
  if (phase !== 'play' || e.target.tagName === 'BUTTON') return;
  e.preventDefault();
  jump();
});
document.getElementById('again').addEventListener('click', e => { e.stopPropagation(); reset(); });
document.getElementById('swap').addEventListener('click', e => { e.stopPropagation(); showSelect(); });

const selEl = document.getElementById('sel'), cardsEl = document.getElementById('cards'), startBtn = document.getElementById('start');
let picked = charId;
CHAR_IDS.forEach(id => {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card.dataset.id = id;
  const c = document.createElement('canvas');
  c.width = 176; c.height = 220;
  const label = document.createElement('div');
  label.textContent = CHARS[id].name;
  card.appendChild(c); card.appendChild(label);
  card.addEventListener('click', e => { e.stopPropagation(); picked = id; markCards(); });
  cardsEl.appendChild(card);
});
function markCards() {
  cardsEl.querySelectorAll('.card').forEach(el => el.classList.toggle('on', el.dataset.id === picked));
  startBtn.classList.toggle('ready', !!CHARS[picked]);
}
function drawCards() {
  cardsEl.querySelectorAll('.card').forEach(el => {
    const id = el.dataset.id, c = el.querySelector('canvas'), g = c.getContext('2d'), ch = CHARS[id];
    g.clearRect(0, 0, c.width, c.height);
    const im = img[ch.still];
    if (im) {
      // 静态图裁上半身做头像
      const sw = im.width * 0.8, sh = sw * c.height / c.width;
      g.drawImage(im, (im.width - sw) / 2, 0, sw, Math.min(sh, im.height), 0, 0, c.width, c.height * Math.min(1, im.height / sh));
    } else {
      placeholder(g, c.width / 2, c.height * 0.92, c.height * 0.85, ch, true);
    }
  });
}
function showSelect() {
  engineOff();
  phase = 'select';
  if (st) { st.over = false; st.truck = null; }
  picked = charId;
  document.getElementById('over').style.display = 'none';
  selEl.style.display = 'flex';
  markCards();
  drawCards();
}
startBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!CHARS[picked]) return;
  charId = picked;
  try { localStorage.setItem(CHAR_KEY, charId); } catch (err) {}
  selEl.style.display = 'none';
  reset();
});

function backToWalk() {
  const b = st.boy;
  b.mode = 'walk';
  b.y = PLATFORM;
  b.vy = 0;
  b.t = 0;
  b.bin = null;
}
function finishMiss() {
  st.chances -= 1;
  if (st.chances <= 0) {
    st.over = true;
    st.boy.mode = 'done';
    engineOff();
    SFX.over();
    document.getElementById('sc').textContent = '得分 ' + st.score;
    document.getElementById('over').style.display = 'flex';
  } else backToWalk();
}
function step(dt) {
  if (phase !== 'play') return;
  const b = st.boy;
  const busy = b.mode === 'in' || st.truck;
  if (!busy && !st.over) {
    const v = binSpeed();
    st.bins.forEach(n => { n.x -= v * dt; });
    st.bins = st.bins.filter(n => n.x > -BIN_W);
    const last = st.bins[st.bins.length - 1];
    if (!last || last.x < W - BIN_GAP) st.bins.push(makeBin(W + BIN_W * 0.7));
  }
  if (b.mode === 'walk') {
    b.t += dt;
    b.x += b.dir * WALK_V * dt;
    if (b.x > W - 28) { b.x = W - 28; b.dir = -1; }
    if (b.x < 28) { b.x = 28; b.dir = 1; }
    b.y = PLATFORM;
  } else if (b.mode === 'fall') {
    b.t += dt;
    const prev = b.y;
    b.vy += GRAV * dt;
    b.y += b.vy * dt;
    if (prev < RIM_Y && b.y >= RIM_Y) {
      const hit = st.bins.find(n => b.x >= MOUTH_LEFT(n.x) && b.x <= MOUTH_RIGHT(n.x));
      if (hit) {
        b.mode = 'in';
        b.bin = hit;
        hit.hold = true;
        b.t = 0;
        b.x = MOUTH_CX(hit.x);
        b.y = RIM_Y + BOY_H * (1 - IN_PEEK);
        SFX.in();
      }
    }
    if (b.mode === 'fall' && b.y >= GROUND) {
      b.y = GROUND;
      b.vy = 0;
      b.mode = 'miss';
      b.t = 0;
      SFX.miss();
    }
  } else if (b.mode === 'miss') {
    b.t += dt;
    b.y = GROUND;
    const need = animReady('miss') ? poseMs('miss') / 1000 : 0.7;
    if (b.t >= need) finishMiss();
  } else if (b.mode === 'in') {
    const n = b.bin;
    b.t += dt;
    b.x = MOUTH_CX(n.x);
    b.y = RIM_Y + BOY_H * (1 - IN_PEEK);
    const wave = animReady('in') ? poseMs('in') / 1000 : 0.84;
    if (b.t > wave) {
      if (n.lid === 0) SFX.lid();
      n.lid = Math.min(1, n.lid + dt * 3.2);
    }
    if (n.lid >= 1 && !st.truck) {
      const goal = Math.min(binDockMax(), Math.max(binDockMin(), n.x));
      if (Math.abs(n.x - goal) > 0.6) {
        n.x += Math.sign(goal - n.x) * Math.min(260 * dt, Math.abs(goal - n.x));
        b.x = MOUTH_CX(n.x);
      } else {
        n.x = goal;
        st.truck = { x: W + 8, phase: 'in', bin: n, t: 0 };
        engineOn();
        SFX.horn();
      }
    }
  }
  if (st.truck) {
    const t = st.truck, n = t.bin;
    const dock = n.x + HANDLE_DX - HOOK_DX;
    if (t.phase === 'in') {
      t.x -= 480 * dt;
      if (t.x <= dock) { t.x = dock; t.phase = 'hold'; t.t = 0; }
    } else if (t.phase === 'hold') {
      t.t += dt;
      t.x = dock;
      if (t.t > 0.28) t.phase = 'drag';
    } else {
      t.x -= 300 * dt;
      n.x = t.x + HOOK_DX - HANDLE_DX;
      b.x = MOUTH_CX(n.x);
      if (n.x < -BIN_W) {
        st.bins = st.bins.filter(m => m !== n);
        st.truck = null;
        st.score += 1;
        engineOff();
        SFX.score();
        backToWalk();
      }
    }
  }
}

const BOY_FOOT_PX = 530, BOY_HEAD_PX = 62, IN_HEAD_PX = 72;
const BOY_SCALE = BOY_H / (BOY_FOOT_PX - BOY_HEAD_PX);
const IN_PEEK_PX = 30;
function drawBoyAt(footX, footY, mode, t, flip, squat) {
  const frame = animReady(mode) ? animFrame(mode, t, mode === 'walk') : null;
  ctx.save();
  ctx.translate(footX, 0);
  if (flip) ctx.scale(-1, 1);
  if (frame) {
    const anchorPx = mode === 'in' ? IN_HEAD_PX : BOY_FOOT_PX;
    let anchorY = mode === 'in' ? RIM_Y - IN_PEEK_PX : footY;
    if (mode === 'in' && st.boy.bin) {
      const topPad = (IN_HEAD_PX - BOY_HEAD_PX) * BOY_SCALE;
      const closed = LID_Y + 6 + topPad;
      const drop = Math.max(0, closed - (RIM_Y - IN_PEEK_PX));
      anchorY += (st.boy.bin.lid || 0) * drop;
    }
    ctx.translate(0, anchorY);
    if (squat && squat !== 1) ctx.scale(1, squat);
    const dw = frame.width * BOY_SCALE, dh = frame.height * BOY_SCALE;
    ctx.drawImage(frame, -dw / 2, -anchorPx * BOY_SCALE, dw, dh);
  } else {
    // 静态图：进桶时随盖子再往下藏，桶沿 clip 会把整个人遮住
    let y = footY;
    if (mode === 'in' && st.boy.bin) y += (st.boy.bin.lid || 0) * (BOY_H * IN_PEEK + 6);
    ctx.translate(0, y);
    if (squat && squat !== 1) ctx.scale(1, squat);
    const ch = CHARS[charId];
    const im = img[ch.still] || img.boy_stripe;
    if (im) {
      const isStripe = im === img.boy_stripe;
      const foot = isStripe ? 859 : im.height, head = isStripe ? 6 : 0;
      const scale = BOY_H / (foot - head);
      ctx.drawImage(im, -im.width * scale / 2, -foot * scale, im.width * scale, im.height * scale);
    } else {
      placeholder(ctx, 0, 0, BOY_H, ch, false);
    }
  }
  ctx.restore();
}
// 色块占位：圆头 + 身体，可选写中文名
function placeholder(g, cx, footY, h, ch, withName) {
  g.save();
  g.fillStyle = ch.color;
  g.beginPath();
  g.roundRect(cx - h * 0.18, footY - h * 0.72, h * 0.36, h * 0.72, h * 0.08);
  g.fill();
  g.fillStyle = '#f3c9a0';
  g.beginPath();
  g.arc(cx, footY - h * 0.84, h * 0.15, 0, Math.PI * 2);
  g.fill();
  g.fillStyle = '#2b1d14';
  g.beginPath();
  g.arc(cx, footY - h * 0.88, h * 0.15, Math.PI, 0);
  g.fill();
  if (withName) {
    let fs = Math.round(h * 0.11);
    g.font = 'bold ' + fs + 'px sans-serif';
    const maxW = h * 0.62;
    const tw = g.measureText(ch.name).width;
    if (tw > maxW) { fs = Math.floor(fs * maxW / tw); g.font = 'bold ' + fs + 'px sans-serif'; }
    g.textAlign = 'center';
    g.lineWidth = Math.max(2, fs * 0.22);
    g.strokeStyle = 'rgba(0,0,0,.55)';
    g.strokeText(ch.name, cx, footY - h * 0.32);
    g.fillStyle = '#fff';
    g.fillText(ch.name, cx, footY - h * 0.32);
  }
  g.restore();
}
function drawBinBody(n) {
  const x = n.x - BIN_W / 2;
  if (img.bin) {
    ctx.save();
    ctx.translate(n.x, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(img.bin, -BIN_W / 2, BIN_TOP, BIN_W, BIN_H);
    ctx.restore();
  } else {
    ctx.fillStyle = '#3caf55';
    ctx.fillRect(x, BIN_TOP, BIN_W, BIN_H);
  }
}
function drawLid(n) {
  if (n.lid <= 0 || !img.bin_lid) return;
  const drop = (1 - n.lid) * 70;
  ctx.drawImage(img.bin_lid, n.x - BIN_W / 2, LID_Y - drop, BIN_W, LID_H);
}
function drawTruck(t) {
  if (img.truck) ctx.drawImage(img.truck, t.x, TRUCK_TOP, TRUCK_W, TRUCK_H);
  else {
    ctx.fillStyle = '#3a8f3a';
    ctx.fillRect(t.x, TRUCK_TOP, TRUCK_W, TRUCK_H);
  }
}
function draw() {
  if (phase !== 'play') {
    ctx.fillStyle = '#b7e3fb';
    ctx.fillRect(0, 0, W, H);
    return;
  }
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#b7e3fb';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#8ed36a';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#d39a55';
  ctx.fillRect(0, PLATFORM, W, 12);
  ctx.fillStyle = '#a56b32';
  ctx.fillRect(0, PLATFORM + 12, W, 5);
  const b = st.boy;
  st.bins.forEach(drawBinBody);
  if (b.mode === 'in') {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, RIM_Y);
    ctx.clip();
    drawBoyAt(b.x, b.y, 'in', b.t, false, 1);
    ctx.restore();
  } else if (b.mode === 'fall') {
    drawBoyAt(b.x, b.y, 'fall', b.t, false, 1);
  } else if (b.mode === 'miss') {
    const squat = animReady('miss') ? 1 : 0.76;
    drawBoyAt(b.x, b.y, 'miss', b.t, false, squat);
  } else if (b.mode === 'walk') {
    drawBoyAt(b.x, b.y, 'walk', b.t, b.dir < 0, 1);
  }
  st.bins.forEach(drawLid);
  if (st.truck) drawTruck(st.truck);
  ctx.fillStyle = '#16324a';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('得分 ' + st.score, 14, 34);
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.fillStyle = i < st.chances ? '#ff9f1c' : 'rgba(0,0,0,.18)';
    ctx.arc(168 + i * 22, 28, 8, 0, Math.PI * 2);
    ctx.fill();
  }
  if (st.hint) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillStyle = 'rgba(12,40,60,.72)';
    ctx.fillText('点一下跳', W / 2, 250);
  }
  ctx.textAlign = 'left';
}

let last = performance.now(), raf = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  step(dt);
  draw();
  raf = requestAnimationFrame(loop);
}
showSelect();
raf = requestAnimationFrame(loop);
</script>
</body>
